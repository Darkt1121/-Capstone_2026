<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1214">
<title>FinFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: landing de una columna centrada; app con barra lateral en escritorio y barra inferior en celular. Diseño oscuro único (decisión del proyecto). */
:root {
  --bg: #0c1214;
  --surface: #131b1e;
  --surface-2: #1a2427;
  --line: #24323a;
  --fg: #eaf1f0;
  --muted: #9aabaa;
  --faint: #6d807f;
  --accent: #5fd4c4;
  --accent-ink: #062320;
  --warn: #f2b45a;
  --warn-bg: #2a2113;
  --warn-line: #5b4316;
  --danger: #ff8b7b;
  --negocio: #5fd4c4;
  --negocio-bg: #123331;
  --personal: #b4a8ff;
  --personal-bg: #241f43;
  --internal: #b8c4c8;
  --internal-bg: #222c30;
  --pos: #6fe0a6;
  --font-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.row { display: flex; gap: 12px; align-items: center; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.wrap { flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; text-decoration: none; color: var(--fg); }
.btn:hover { border-color: #37505a; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { background: #7ae0d2; border-color: #7ae0d2; }
.btn-ghost { background: transparent; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; min-height: 32px; }

/* Tarjetas */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card h3 { font-size: 17px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip svg { width: 12px; height: 12px; }
.chip-negocio { background: var(--negocio-bg); color: var(--negocio); }
.chip-personal { background: var(--personal-bg); color: var(--personal); }
.chip-internal { background: var(--internal-bg); color: var(--internal); }
.chip-review { background: var(--warn-bg); color: var(--warn); }

/* ---------- Landing ---------- */
.landing { padding-inline: 20px; }
.l-nav { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding-block: 18px; gap: 12px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.logo-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.logo-mark svg { width: 18px; height: 18px; }
.l-links { display: flex; gap: 22px; align-items: center; }
.l-links a { color: var(--muted); text-decoration: none; font-weight: 500; }
.l-links a:hover { color: var(--fg); }
.hero { max-width: 980px; margin: 0 auto; text-align: center; padding-block: 72px 40px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.hero h1 { font-size: clamp(40px, 7vw, 76px); line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; }
.hero h1 .dim { color: #5d6f72; display: block; }
.hero .lead { font-size: clamp(16px, 2vw, 19px); color: var(--muted); max-width: 640px; }
.badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); border: 1px solid var(--line); padding: 4px 12px; border-radius: 999px; }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.trust { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 13px; }
.trust span { display: inline-flex; align-items: center; gap: 6px; }
.trust svg { width: 15px; height: 15px; color: var(--accent); }

.preview { max-width: 1120px; margin: 8px auto 0; border: 1px solid var(--line); border-radius: 22px; background: radial-gradient(120% 80% at 50% 0%, #15302d 0%, var(--surface) 55%); padding: 22px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; }
.p-label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.p-label i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.p-big { font-family: var(--font-display); font-size: 40px; font-weight: 800; letter-spacing: -0.03em; }

.section { max-width: 1120px; margin: 0 auto; padding-block: 88px 24px; }
.section h2 { font-size: clamp(30px, 4.5vw, 50px); line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; }
.section h2 .accent { color: var(--accent); display: block; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1fr); align-items: center; margin-top: 36px; }
.duo-line { height: 2px; background: repeating-linear-gradient(90deg, var(--faint) 0 6px, transparent 6px 12px); }
.device-desk { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px; }
.device-desk .bar { display: flex; gap: 6px; margin-bottom: 12px; }
.device-desk .bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.drop { border: 1.5px dashed #37505a; border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); }
.phone { width: 250px; max-width: 100%; justify-self: center; border: 1px solid var(--line); border-radius: 34px; padding: 14px; background: #0a0f10; }
.phone-screen { border-radius: 24px; background: var(--surface); padding: 16px 14px; min-height: 300px; display: flex; flex-direction: column; gap: 10px; }
.push { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 13px; }
.features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 36px; }
.feature h3 { font-size: 19px; margin-bottom: 6px; }
.footer { max-width: 1120px; margin: 64px auto 0; padding-block: 28px 40px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--faint); font-size: 13px; }

/* ---------- Acceso / onboarding ---------- */
.center-wrap { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; }
.panel { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 18px; }
.panel h1 { font-size: 30px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input { min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); width: 100%; }
.input:focus { outline: none; border-color: var(--accent); }
.divider { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 13px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.steps { display: flex; gap: 8px; }
.steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.steps i.on { background: var(--accent); }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--muted); }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
.banks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.bank { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); text-align: left; padding: 8px 12px; font-weight: 600; }
.bank[aria-pressed="true"] { border-color: var(--accent); background: var(--negocio-bg); }
.guide { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.dropzone { border: 1.5px dashed #37505a; border-radius: 14px; padding: 24px 16px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.dropzone.over { border-color: var(--accent); background: var(--negocio-bg); }
.result { border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.result.ok { background: #10302b; color: #bff3e8; }
.result.err { background: #3a1915; color: #ffd0c8; }
.acc-list { display: flex; flex-direction: column; gap: 8px; }
.acc { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }

/* ---------- App ---------- */
.app { display: flex; min-height: 100%; }
.side { width: 232px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.side nav { display: flex; flex-direction: column; gap: 4px; }
.nav-btn { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: none; color: var(--muted); font-weight: 600; text-align: left; }
.nav-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
.nav-btn[aria-current="page"] { background: var(--surface-2); color: var(--fg); }
.nav-btn[aria-current="page"] svg { color: var(--accent); }
.main { flex: 1; min-width: 0; padding: 24px 28px 40px; }
.main-inner { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.topline { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.topline h1 { font-size: 28px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.balance { font-family: var(--font-display); font-size: clamp(38px, 6vw, 52px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; }
.acc-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.acc-pill { font-size: 12px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }
.alert { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: var(--radius); padding: 16px; display: flex; gap: 12px; }
.alert svg { width: 22px; height: 22px; color: var(--warn); flex-shrink: 0; }
.alert strong { color: #ffd79a; }
.alert p { color: #ead7b4; font-size: 14px; }
.ok-box { background: #10302b; border: 1px solid #1d4b44; border-radius: var(--radius); padding: 16px; color: #bff3e8; }
.summary-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.summary-list li { display: flex; gap: 10px; font-size: 15px; }
.summary-list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 9px; flex-shrink: 0; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.split .box { border-radius: 12px; padding: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.split .v { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.bar-track { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.qr-card { display: flex; gap: 16px; align-items: center; }
.qr-box { background: #fff; padding: 8px; border-radius: 10px; width: 112px; height: 112px; flex-shrink: 0; display: grid; place-items: center; }
.qr-box img, .qr-box canvas { width: 96px !important; height: 96px !important; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .input { flex: 1 1 220px; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.filter { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 600; font-size: 13px; }
.filter[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tx-group { display: flex; flex-direction: column; }
.tx-date { font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 14px 4px 6px; }
.tx { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 6px; }
.tx:hover { border-color: #37505a; }
.tx-desc { font-weight: 600; overflow-wrap: anywhere; }
.tx-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--faint); grid-column: 1 / -1; }
.tx-amt { font-weight: 700; white-space: nowrap; grid-row: 1; grid-column: 2; }
.tx-amt.pos { color: var(--pos); }
.tx.is-internal .tx-amt { color: var(--muted); text-decoration: line-through; text-decoration-color: #4b5f63; }

.chart-wrap { width: 100%; overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; min-width: 300px; height: auto; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; }
.upcoming { display: flex; flex-direction: column; }
.up { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.up:last-child { border-bottom: 0; }

/* Hoja inferior / panel de corrección */
.scrim { position: fixed; inset: 0; background: rgba(4, 8, 9, .62); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 92vh; overflow-y: auto; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.seg button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-pressed="true"].neg { border-color: var(--negocio); background: var(--negocio-bg); color: var(--negocio); }
.seg button[aria-pressed="true"].per { border-color: var(--personal); background: var(--personal-bg); color: var(--personal); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 60; width: min(420px, calc(100% - 32px)); background: #1f2b2f; border: 1px solid #36505a; border-radius: 16px; padding: 12px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.45); display: flex; gap: 12px; animation: drop .35s ease; }
@keyframes drop { from { transform: translate(-50%, -16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.toast .logo-mark { flex-shrink: 0; }

.bottom-nav { display: none; }
.demo-tag { font-size: 12px; color: var(--warn); border: 1px solid var(--warn-line); background: var(--warn-bg); padding: 3px 10px; border-radius: 999px; }
textarea.input { min-height: 160px; padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }

/* Gráficos interactivos y animaciones */
.chart-int { position: relative; }
.ff-chart { touch-action: pan-y; }
.ff-chart .ff-hit { cursor: crosshair; }
.ff-min { cursor: ns-resize; }
.ff-chart.dragging { cursor: ns-resize; }
.ff-chart.dragging .ff-min-knob { fill: var(--danger); }
.ff-tip { position: absolute; z-index: 5; pointer-events: none; min-width: 190px; max-width: 260px; background: #1f2b2f; border: 1px solid #36505a; border-radius: 12px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.ff-tip[hidden] { display: none; }
.ff-tip b { font-weight: 700; }
.tip-warn { color: var(--warn); }
.ff-chart.anim .ff-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ff-draw 1.2s cubic-bezier(.4,0,.2,1) .15s forwards; }
.ff-chart.anim .ff-band { animation: ff-fade .9s ease .35s both; }
.ff-chart.anim .ff-pt { animation: ff-pop .4s ease both; transform-box: fill-box; transform-origin: center; }
.ff-pulse { transform-box: fill-box; transform-origin: center; animation: ff-pulse 2.2s ease-in-out 1.4s infinite; }
.bar-track span { transform-origin: left; }
.bar-track.anim span { animation: ff-grow .9s cubic-bezier(.4,0,.2,1) both; }
.bar-track.anim span:nth-child(2) { animation-delay: .1s; } .bar-track.anim span:nth-child(3) { animation-delay: .2s; } .bar-track.anim span:nth-child(4) { animation-delay: .3s; }
@keyframes ff-draw { to { stroke-dashoffset: 0; } }
@keyframes ff-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes ff-pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes ff-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
@keyframes ff-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .preview { grid-template-columns: minmax(0, 1fr); }
  .duo { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .duo-line { width: 2px; height: 36px; justify-self: center; background: repeating-linear-gradient(180deg, var(--faint) 0 6px, transparent 6px 12px); }
  .features { grid-template-columns: minmax(0, 1fr); }
  .l-links a { display: none; }
  .side { display: none; }
  .main { padding: 18px 16px calc(92px + env(safe-area-inset-bottom, 0px)); }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .bottom-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(12, 18, 20, .96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); backdrop-filter: blur(8px); }
  .bottom-nav .nav-btn { flex-direction: column; gap: 3px; justify-content: center; font-size: 11px; min-height: 62px; padding: 0; text-align: center; border-radius: 0; }
  .bottom-nav .nav-btn[aria-current="page"] { background: none; color: var(--accent); }
  .qr-desktop { display: none; }
}
@media (max-width: 420px) {
  .banks { grid-template-columns: minmax(0, 1fr); }
  .split .v { font-size: 20px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://js.fintoc.com/v1/"></script>
<script>

<script>
/* FinFlow · lógica del prototipo (se ejecuta en el navegador).
   Importación de cartolas CSV, clasificación Negocio/Personal con reglas y motivo,
   transferencias internas, resumen del mes y proyección a 4 semanas. */
(function (root) {
  'use strict';

  // ---------- utilidades ----------
  const strip = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
  const DAY = 86400000;
  const toDate = (iso) => new Date(iso + 'T12:00:00');
  const iso = (d) => d.toISOString().slice(0, 10);
  const addDays = (isoStr, n) => iso(new Date(toDate(isoStr).getTime() + n * DAY));
  const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / DAY);

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- lectura CSV ----------
  function splitLine(line, delim) {
    const out = []; let cur = ''; let q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { q = !q; continue; }
      if (c === delim && !q) { out.push(cur); cur = ''; continue; }
      cur += c;
    }
    out.push(cur);
    return out.map((x) => x.trim());
  }

  function parseAmount(text) {
    let s = String(text || '').replace(/\$/g, '').replace(/\s/g, '');
    if (!s) return 0;
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^-?\d+,\d{1,2}$/.test(s)) s = s.replace(',', '.');
    const n = Number(s);
    if (Number.isNaN(n)) throw new Error('Monto no reconocido: "' + text + '"');
    return Math.round(n);
  }

  function parseDate(text) {
    const s = String(text || '').trim();
    let m = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    throw new Error('Fecha no reconocida: "' + text + '"');
  }

  const COLS = {
    date: /^(FECHA|FECHA OPERACION|FECHA MOVIMIENTO|DATE)$/,
    desc: /^(DESCRIPCION|DETALLE|GLOSA|CONCEPTO|DESCRIPCION MOVIMIENTO|DETALLE DE TRANSACCION)$/,
    debit: /^(CARGO|CARGOS|DEBITO|DEBITOS|MONTO CARGOS)$/,
    credit: /^(ABONO|ABONOS|DEPOSITO|DEPOSITOS|CREDITO|CREDITOS|MONTO ABONOS)$/,
    amount: /^(MONTO|IMPORTE|AMOUNT)$/,
    balance: /^(SALDO|SALDO DISPONIBLE|BALANCE)$/,
  };

  /** Lee una cartola CSV. Devuelve filas en orden cronológico y el resultado de la validación de saldo. */
  function parseStatement(text) {
    const lines = String(text).replace(/^﻿/, '').split(/\r?\n/).filter((l) => l.trim());
    if (lines.length < 2) throw new Error('El archivo no tiene movimientos.');
    const delim = (lines[0].split(';').length >= lines[0].split(',').length) ? ';' : ',';
    const header = splitLine(lines[0], delim).map(strip);
    const idx = {};
    for (const [key, re] of Object.entries(COLS)) idx[key] = header.findIndex((h) => re.test(h));
    if (idx.date < 0 || idx.desc < 0 || (idx.amount < 0 && idx.debit < 0 && idx.credit < 0)) {
      const e = new Error('No reconocemos las columnas de esta cartola. Necesitamos fecha, descripción y monto.');
      e.code = 'unknown_format';
      throw e;
    }
    const rows = lines.slice(1).map((line, i) => {
      const c = splitLine(line, delim);
      const amount = idx.amount >= 0
        ? parseAmount(c[idx.amount])
        : parseAmount(c[idx.credit]) - Math.abs(parseAmount(c[idx.debit]));
      return {
        date: parseDate(c[idx.date]),
        description: (c[idx.desc] || '').replace(/\s+/g, ' ').trim(),
        amount,
        balance: idx.balance >= 0 && c[idx.balance] ? parseAmount(c[idx.balance]) : null,
        _line: i,
      };
    });
    // Orden cronológico estable (algunos bancos exportan del más nuevo al más antiguo).
    if (rows.length > 1 && rows[0].date > rows[rows.length - 1].date) rows.reverse();
    let check = null;
    if (rows[0].balance !== null && rows[rows.length - 1].balance !== null) {
      const opening = rows[0].balance - rows[0].amount;
      const computed = opening + rows.reduce((s, r) => s + r.amount, 0);
      check = { opening, closing: rows[rows.length - 1].balance, ok: computed === rows[rows.length - 1].balance };
    }
    return { rows, check, delimiter: delim };
  }

  // ---------- clasificación ----------
  const RULES = [
    // [regex sobre la glosa, ámbito, motivo]
    [/ARRIENDO DEPTO|ARRIENDO CASA|DIVIDENDO/, 'personal', 'arriendo de vivienda'],
    [/LIDER|JUMBO|SANTA ISABEL|UNIMARC|TOTTUS|ACUENTA/, 'personal', 'supermercado'],
    [/FARMACIA|CRUZ VERDE|SALCOBRAND|AHUMADA/, 'personal', 'farmacia'],
    [/NETFLIX|SPOTIFY|DISNEY|HBO|CINEMARK|CINEPLANET/, 'personal', 'entretención'],
    [/PEDIDOSYA|RAPPI|UBER EATS|RESTAUR/, 'personal', 'comida'],
    [/MOVISTAR|ENTEL|CLARO|WOM|ENEL|AGUAS|METROGAS|CGE/, 'personal', 'servicios del hogar'],
    [/\bUBER\b|DIDI|CABIFY/, 'personal', 'transporte'],
    [/ADOBE|CANVA|FIGMA|NOTION|GOOGLE WORKSPACE|HOSTING|DOMINIO/, 'negocio', 'herramienta de trabajo'],
    [/COWORK/, 'negocio', 'espacio de trabajo'],
    [/LINK DE PAGO|COBRO|BOLETA|HONORARIO/, 'negocio', 'cobro a cliente'],
    [/\bSII\b|TESORERIA|IMPOSICION/, 'negocio', 'impuestos'],
  ];
  const COMPANY = /\b(SPA|LTDA|LIMITADA|EIRL|S\.?A\.?)\b/;

  /** Clave de contraparte para las reglas personales: glosa sin números ni prefijos. */
  function counterpartyKey(description) {
    return strip(description)
      .replace(/^(PAGO EN|PAGO|COMPRA|PAC|TRANSF(ERENCIA)?( RECIBIDA| ENVIADA)? (DE|A)|COBRO)\s+/, '')
      .replace(/\d+/g, '').replace(/\s+/g, ' ').trim();
  }

  function classify(tx, userRules) {
    const key = counterpartyKey(tx.description);
    if (userRules && typeof userRules[key] === 'string') return { scope: userRules[key], reason: 'tu corrección anterior', source: 'user', review: false };
    const g = strip(tx.description);
    for (const [re, scope, why] of RULES) {
      const m = g.match(re);
      if (m) return { scope, reason: `por la glosa: ${m[0].trim()} (${why})`, source: 'rule', review: false };
    }
    if (tx.amount > 0 && COMPANY.test(g)) return { scope: 'negocio', reason: 'te pagó una empresa', source: 'rule', review: false };
    if (tx.amount > 0 && /TRANSF/.test(g)) return { scope: 'personal', reason: 'transferencia de una persona', source: 'rule', review: true };
    return { scope: 'personal', reason: 'sin coincidencias: revísalo', source: 'rule', review: true };
  }

  function category(scope, amount) {
    if (scope === 'negocio') return amount >= 0 ? 'ingreso_negocio' : 'gasto_operacional';
    return amount >= 0 ? 'ingreso_personal' : 'gasto_personal';
  }

  // ---------- transferencias internas ----------
  function holderTokens(name) { return strip(name).split(/\s+/).filter((t) => t.length >= 3); }
  const TRANSFER = /TRASP|TRANSF|TEF/;

  function markInternal(txs, holderName) {
    const holder = holderTokens(holderName);
    for (const t of txs) {
      if (t.manualInternal !== undefined) { t.internal = t.manualInternal; continue; }
      t.internal = false;
      const g = strip(t.description);
      if (TRANSFER.test(g)) {
        const hits = holder.filter((h) => g.includes(h)).length;
        if (hits >= Math.min(2, holder.length)) { t.internal = true; t.internalReason = 'el titular eres tú'; }
      }
    }
    // Entre cuentas: mismo monto (signo opuesto), cuentas distintas, ±1 día.
    const open = txs.filter((t) => !t.internal && t.manualInternal === undefined && TRANSFER.test(strip(t.description)));
    for (const a of open) {
      if (a.internal || a.amount >= 0) continue;
      const b = open.find((x) => !x.internal && x !== a && x.account !== a.account && x.amount === -a.amount && Math.abs(diffDays(a.date, x.date)) <= 1);
      if (b) { a.internal = b.internal = true; a.internalReason = b.internalReason = 'el mismo monto llegó a tu otra cuenta'; }
    }
    return txs;
  }

  // ---------- armado de movimientos ----------
  function buildTransactions(accounts, holderName, userRules) {
    const txs = [];
    for (const acc of accounts) {
      for (const r of acc.rows) {
        txs.push({ id: `${acc.id}:${r.date}:${r._line}`, account: acc.id, accountName: acc.name, ...r });
      }
    }
    txs.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a._line - b._line));
    const manual = (userRules && userRules.__internal) || {};
    for (const t of txs) if (manual[t.id] !== undefined) t.manualInternal = manual[t.id];
    markInternal(txs, holderName);
    for (const t of txs) {
      Object.assign(t, classify(t, userRules));
      const one = userRules && userRules.__tx && userRules.__tx[t.id];
      if (one) Object.assign(t, { scope: one, reason: 'corregido por ti', source: 'user', review: false });
      if (t.internal) t.review = false;
      t.category = category(t.scope, t.amount);
    }
    return txs;
  }

  /** Une filas nuevas a una cuenta, sin duplicados (misma fecha, glosa, monto y orden en el día). */
  function mergeRows(existing, incoming) {
    const key = (r, n) => `${r.date}|${strip(r.description)}|${r.amount}|${n}`;
    const count = {};
    const keys = new Set(existing.map((r) => { const b = `${r.date}|${strip(r.description)}|${r.amount}`; count[b] = (count[b] || 0) + 1; return key(r, count[b]); }));
    const seen = {};
    const added = [];
    let maxLine = existing.reduce((m, r) => Math.max(m, r._line), -1);
    for (const r of incoming) {
      const b = `${r.date}|${strip(r.description)}|${r.amount}`;
      seen[b] = (seen[b] || 0) + 1;
      if (!keys.has(key(r, seen[b]))) added.push({ ...r, _line: ++maxLine });

        <span class="${q.belowOf20 >= 3 ? 'tip-warn' : 'faint'}">${q.belowOf20} de 20 escenarios bajo tu mínimo</span>

    }
    tip.innerHTML = html; tip.hidden = false;
    const rect = svg.getBoundingClientRect(); const left = (c.xs[i] / c.W) * rect.width;
    tip.style.left = Math.max(8, Math.min(rect.width - tip.offsetWidth - 8, left - tip.offsetWidth / 2)) + 'px';
    tip.style.top = Math.max(0, (yv / c.H) * rect.height - tip.offsetHeight - 14) + 'px';
  }
  function hideTip(svg) {
    if (!svg) return;
    svg.querySelector('.ff-guide').setAttribute('visibility', 'hidden');
    svg.querySelector('.ff-hover').setAttribute('visibility', 'hidden');
    const tip = svg.parentElement.querySelector('.ff-tip'); if (tip) tip.hidden = true;
  }
  let dragging = null;
  function minFromEvent(svg, evt) {
    const c = CHARTS[svg.dataset.chart]; const { y } = chartPoint(svg, evt);
    const v = c.hi - ((y - c.padT) / (c.H - c.padT - c.padB)) * (c.hi - c.lo);
    return Math.max(0, Math.round(Math.min(c.hi, Math.max(c.lo, v)) / 10000) * 10000);
  }
  function moveMin(svg, v) {
    const c = CHARTS[svg.dataset.chart]; const yy = c.padT + ((c.hi - v) / (c.hi - c.lo)) * (c.H - c.padT - c.padB);
    svg.querySelectorAll('.ff-min-hit, .ff-min-line').forEach((l) => { l.setAttribute('y1', yy); l.setAttribute('y2', yy); });
    svg.querySelector('.ff-min-knob').setAttribute('cy', yy);
    const t = svg.querySelector('.ff-min-label'); t.setAttribute('y', yy - 8); t.textContent = `Tu mínimo ${fmt(v)}`;
  }
  document.addEventListener('pointerdown', (e) => {
    if (e.target.classList && e.target.classList.contains('ff-hit')) { showTip(e.target.ownerSVGElement, e); return; }
    const g = e.target.closest('.ff-min'); if (!g) return;
    const svg = g.ownerSVGElement; e.preventDefault();
    dragging = { svg, value: minFromEvent(svg, e) }; svg.classList.add('dragging'); hideTip(svg);
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* nada */ }
    moveMin(svg, dragging.value);
  });
  document.addEventListener('pointermove', (e) => {
    if (dragging) { dragging.value = minFromEvent(dragging.svg, e); moveMin(dragging.svg, dragging.value); return; }
    const svg = e.target.closest && e.target.closest('svg.ff-chart');
    document.querySelectorAll('svg.ff-chart').forEach((s) => { if (s !== svg) hideTip(s); });
    if (svg && e.target.classList.contains('ff-hit')) showTip(svg, e);
  });
  document.addEventListener('pointerup', () => {
    if (!dragging) return;
    const v = dragging.value; dragging.svg.classList.remove('dragging'); dragging = null;
    S.minimum = v; animateNext = false; render();
  });

  // Números que suben al cargar.
  function countUp() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('[data-count]').forEach((el) => {
      const target = Number(el.dataset.count); const t0 = performance.now(); const dur = 900;
      const tick = (t) => { const k = Math.min(1, (t - t0) / dur); const e = 1 - Math.pow(1 - k, 3); el.textContent = (target < 0 ? '−' : '') + fmt(target * e); if (k < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
  }

  function txCounts() {
    const c = { todos: 0, negocio: 0, personal: 0, revisar: 0, internas: 0 };
    for (const t of D.txs) { c.todos++; if (t.internal) c.internas++; else { c[t.scope]++; if (t.review) c.revisar++; } }
    return c;
  }
  function visibleTxs() {
    const q = S.query.trim().toUpperCase();
    return D.txs.filter((t) => {
      if (S.accFilter !== 'todas' && t.account !== S.accFilter) return false;
      if (S.filter === 'negocio' && (t.internal || t.scope !== 'negocio')) return false;
      if (S.filter === 'personal' && (t.internal || t.scope !== 'personal')) return false;
      if (S.filter === 'revisar' && (t.internal || !t.review)) return false;
      if (S.filter === 'internas' && !t.internal) return false;
      if (q && !t.description.toUpperCase().includes(q) && !String(Math.abs(t.amount)).includes(q.replace(/\D/g, '') || '§')) return false;
      return true;
    }).slice().reverse();
  }

    for (const t of list.slice(0, 160)) {
      if (t.date !== cur) { if (cur) html += '</div>'; cur = t.date; html += `<div class="tx-group"><div class="tx-date">${FF.shortDate(t.date)}</div>`; }
      html += `<button class="tx ${t.internal ? 'is-internal' : ''}" data-act="open-tx" data-id="${esc(t.id)}">
        <span class="tx-desc">${esc(t.description)}</span>
        <span class="tx-amt num ${t.amount > 0 ? 'pos' : ''}">${signed(t.amount)}</span>
        <span class="tx-meta">${chipFor(t)}<span>${esc(t.accountName)}</span><span>· ${esc(t.internal ? t.internalReason || 'traspaso propio' : t.reason)}</span></span>
      </button>`;
    }
    if (cur) html += '</div>';
    return `
      <div class="topline"><div><h1>Movimientos</h1><p class="small muted">Toca un movimiento para cambiarlo entre Negocio y Personal.</p></div><button class="btn" data-act="add-account">Importar cartola</button></div>
      <div class="toolbar">
        <input class="input" id="q" type="search" placeholder="Buscar por descripción o monto" aria-label="Buscar movimiento" value="${esc(S.query)}">
        <select class="input" id="accf" aria-label="Filtrar por cuenta" style="flex:0 1 200px"><option value="todas">Todas las cuentas</option>${S.accounts.map((a) => `<option value="${a.id}" ${S.accFilter === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      </div>
      <div class="filters" role="group" aria-label="Filtrar movimientos">${F.map(([id, l]) => `<button class="filter" data-act="filter" data-f="${id}" aria-pressed="${S.filter === id}">${l} · ${c[id]}</button>`).join('')}</div>
      <div>${html || '<p class="muted" style="padding:24px 4px">No hay movimientos con este filtro.</p>'}</div>`;
  }

  function tabProy() {
    const d = D; const p = d.proj;
    return `
      <div class="topline"><div><h1>Proyección</h1><p class="small muted">Próximas 4 semanas, desde el ${FF.shortDate(d.today)}.</p></div></div>
      <section class="card stack">
        <div class="chart-wrap">${chart(d, { w: 760, h: 300 })}</div>
        <p class="xs faint">Pasa el cursor o toca una semana para ver el detalle. Arrastra la línea roja para cambiar tu mínimo.</p>
        <div class="legend"><span><i style="background:var(--accent)"></i>Saldo más probable</span><span><i style="background:var(--accent);opacity:.35;height:10px"></i>Rango probable (8 de cada 10 escenarios)</span><span><i style="background:var(--danger)"></i>Tu mínimo</span></div>
        <p style="font-size:17px;font-weight:600">${esc(phrase(p))}</p>
        ${p.alert ? `<p class="muted">Ese saldo te alcanza para ${p.alert.daysCovered} días de gastos personales (gastas en promedio ${fmt(p.dailyPersonal)} al día).</p>` : ''}
      </section>
      <div class="grid-2">
        <section class="card stack">
          <h3>Lo que viene</h3>
          <p class="xs faint">Movimientos que se repiten cada mes, detectados en tu historia.</p>
          <div class="upcoming">${p.upcoming.map((u) => `<div class="up"><div><div style="font-weight:600">${esc(FF.titleCase(u.name))}</div><div class="xs faint">${FF.shortDate(u.date)} · semana ${u.week} · <span class="chip chip-${u.scope}">${u.scope === 'negocio' ? 'Negocio' : 'Personal'}</span></div></div><span class="num ${u.amount > 0 ? 'tx-amt pos' : ''}" style="font-weight:700">${signed(u.amount)}</span></div>`).join('') || '<p class="muted">Aún no detectamos movimientos fijos.</p>'}</div>
        </section>
        <div class="col">
          <section class="card stack">
            <h3>Tu mínimo</h3>
            <p class="small muted">Te avisamos una sola vez, unos 7 días antes de bajar de este monto.</p>
            <div class="field"><label for="minimum">Monto mínimo (CLP)</label><input class="input num" id="minimum" type="number" inputmode="numeric" min="0" step="10000" value="${S.minimum}"></div>
          </section>
          <section class="card stack">
            <h3>Cómo se calcula</h3>
            <p class="small muted">1. Detectamos tus movimientos fijos (${p.recurring.length} encontrados) y los ubicamos en su fecha.</p>
            <p class="small muted">2. El resto de tus ingresos y gastos se proyecta por semana con suavizado exponencial (nivel y tendencia).</p>
            <p class="small muted">3. Repetimos el cálculo en 200 escenarios con la variación real de tu historia. La banda muestra el rango donde cae la mayoría.</p>
            <p class="xs faint">Versión prototipo del modelo. La versión final usa Holt-Winters en el servidor (statsmodels).</p>
          </section>
        </div>
      </div>`;
  }

  function tabPerfil() {
    return `
      <div class="topline"><h1>Perfil</h1></div>
      <div class="grid-2">
        <div class="col">
          <section class="card stack">
            <h3>Tu cuenta</h3>
            <p><span class="muted small">Titular en tus cartolas</span><br><strong>${esc(S.holder)}</strong></p>
            <p><span class="muted small">Acceso</span><br>${esc((S.user && S.user.email) || 'Modo demo')}</p>
          </section>
          <section class="card stack">
            <div class="row between"><h3>Cuentas</h3><button class="link-btn" data-act="add-account" ${S.accounts.length >= 3 ? 'disabled' : ''}>Agregar cuenta</button></div>
            <div class="acc-list">${D.bals.map((b) => `<div class="acc"><div><strong>${esc(b.name)}</strong><div class="xs faint num">${fmt(b.balance)} · hasta el ${FF.shortDate(b.lastDate)}</div></div><button class="link-btn" data-act="remove-acc" data-id="${b.id}" aria-label="Quitar ${esc(b.name)}">Quitar</button></div>`).join('')}</div>
            ${(FINTOC.enabled && S.accounts.some((a) => a.source === 'fintoc')) ? `<div class="row wrap"><button class="btn" data-act="fintoc-sync" ${FINTOC.busy ? 'disabled' : ''}>${FINTOC.busy ? 'Actualizando…' : 'Actualizar desde el banco'}</button></div>${FINTOC.msg ? `<p class="small muted" role="status">${esc(FINTOC.msg)}</p>` : ''}` : ''}
            <p class="xs faint">Hasta 3 cuentas. Al volver a subir una cartola, los movimientos repetidos se ignoran.</p>
          </section>
        </div>
        <div class="col">
          <section class="card stack">
            <h3>Tus datos</h3>
            <p class="small muted">Puedes llevarte todos tus movimientos clasificados o borrar tu cuenta con todo lo que contiene.</p>
            <div class="row wrap"><button class="btn" data-act="export">Exportar mis datos (CSV)</button><button class="btn" data-act="ask-delete">${I.trash}Borrar mi cuenta y mis datos</button></div>
            ${S.exportOpen ? `<textarea class="input" id="csv" readonly aria-label="Tus datos en CSV">${esc(FF.toCSV(D.txs))}</textarea><button class="btn" data-act="copy-csv">Copiar CSV</button><span class="xs faint" id="copy-msg"></span>` : ''}
            ${S.confirmDelete ? `<div class="result err stack" style="gap:10px"><strong>¿Borrar todo?</strong><span>Se eliminan tu cuenta, tus cartolas, tus correcciones y tus alertas. No se puede deshacer.</span><div class="row wrap"><button class="btn" data-act="do-delete" style="border-color:var(--danger);color:var(--danger)">Sí, borrar todo</button><button class="btn btn-ghost" data-act="cancel-delete">Cancelar</button></div></div>` : ''}
          </section>
          <button class="btn btn-ghost" data-act="logout" style="align-self:flex-start">Cerrar sesión</button>
        </div>
      </div>`;
  }

  function sheet() {
    const t = D.txs.find((x) => x.id === S.sheetId); if (!t) return '';
    const key = FF.counterpartyKey(t.description);
    return `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-stop>
      <div class="row between"><h3 id="sheet-title" style="font-size:18px">${esc(t.description)}</h3><button class="link-btn" data-act="close-sheet" aria-label="Cerrar">Cerrar</button></div>
      <div class="row between small muted"><span>${FF.shortDate(t.date)} · ${esc(t.accountName)}</span><strong class="num" style="color:var(--fg);font-size:18px">${signed(t.amount)}</strong></div>
      <label class="check"><input type="checkbox" id="is-internal" ${t.internal ? 'checked' : ''}><span>Es un traspaso entre mis cuentas (no cuenta como ingreso ni gasto)</span></label>
      <div class="stack" id="scope-block" style="gap:8px;${t.internal ? 'opacity:.4' : ''}">
        <span class="eyebrow">¿De qué es este movimiento?</span>
        <div class="seg" role="group" aria-label="Ámbito">
          <button class="neg" data-act="pick-scope" data-scope="negocio" aria-pressed="${t.scope === 'negocio'}">${I.brief}Negocio</button>
          <button class="per" data-act="pick-scope" data-scope="personal" aria-pressed="${t.scope === 'personal'}">${I.person}Personal</button>
        </div>
        <span class="xs faint">Motivo actual: ${esc(t.reason)}</span>
        <label class="check"><input type="checkbox" id="apply-all" checked><span>Aplicar también a los otros movimientos de ${esc(FF.titleCase(key) || 'esta contraparte')}</span></label>
      </div>
      <button class="btn btn-primary btn-block" data-act="save-tx">Guardar · FinFlow aprende de tu corrección</button>
    </div></div>`;
  }

  function toast() {
    const a = D && D.proj.alert;
    return `<div class="toast" role="status"><span class="logo-mark">${I.logo}</span><div><strong>FinFlow</strong><p class="small">${a ? `La semana del ${FF.shortDate(a.start)} podrías bajar de tu mínimo. Te alcanza para ${a.daysCovered} días.` : 'Tu saldo se mantiene sobre tu mínimo este mes.'}</p></div></div>`;
  }

  // ---------- render ----------
  let pickedScope = null;
  function render() {
    D = S.accounts.length ? derive(S) : null;
    if (S.view === 'app' && !D) S.view = 'onboard';
    const html = { landing: viewLanding, auth: viewAuth, onboard: viewOnboard, app: viewApp }[S.view]();
    $root.innerHTML = html;
    save();
    afterRender();
    if (animateNext) countUp();
    animateNext = false;
  }
  function afterRender() {
    const qr = document.getElementById('qr');
    if (qr && window.QRCode) { try { new window.QRCode(qr, { text: SHARE_URL, width: 96, height: 96, colorDark: '#0c1214', colorLight: '#ffffff' }); } catch (e) { qr.textContent = 'QR'; } }
    const dz = document.getElementById('dropzone');
    if (dz) {
      dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('over'));
      dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files[0]) importFile(e.dataTransfer.files[0]); });
    }
  }
  const go = (patch) => { Object.assign(S, patch); animateNext = true; render(); window.scrollTo(0, 0); };

  // ---------- importar ----------
  function bankShort(b) { return { 'BancoEstado CuentaRUT': 'CuentaRUT', 'Otro banco': 'Otra cuenta' }[b] || b; }
  function readFile(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      if (/\.xlsx?$/i.test(file.name)) {
        r.onload = () => { try { const wb = window.XLSX.read(r.result, { type: 'array' }); resolve(window.XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]], { FS: ';' })); } catch (e) { reject(new Error('No pudimos leer el Excel.')); } };
        r.readAsArrayBuffer(file);
      } else { r.onload = () => resolve(r.result); r.readAsText(file, 'utf-8'); }
      r.onerror = () => reject(new Error('No pudimos leer el archivo.'));
    });
  }
  // ---------- conexión bancaria (Fintoc) ----------
  // Las llaves secretas y el link_token viven solo en el servidor (server.js).
  async function api(path, opts) {
    const r = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' }, opts));
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'No pudimos comunicarnos con el servidor.');
    return j;
  }
  fetch('/api/fintoc/config').then((r) => (r.ok ? r.json() : null)).then((c) => { if (c && c.enabled) { FINTOC.enabled = true; render(); } }).catch(() => { /* sin servidor: solo cartolas */ });

  async function syncFintoc() {
    const j = await api('/api/fintoc/movements');
    const usable = j.accounts.filter((a) => a.rows.length);
    if (!usable.length) throw new Error('Tu banco no devolvió movimientos en el último año.');
    if (S.sample) { S.accounts = []; S.sample = false; }
    let added = 0, dup = 0;
    for (const fa of usable) {
      let acc = S.accounts.find((a) => a.id === fa.id);
      if (acc) { const m = FF.mergeRows(acc.rows, fa.rows); acc.rows = m.rows; added += m.added; dup += m.duplicates; }
      else {
        if (S.accounts.length >= 3) break;
        acc = { id: fa.id, name: fa.name, bank: fa.bank, source: 'fintoc', rows: fa.rows }; S.accounts.push(acc); added += fa.rows.length;
      }
      // El saldo real del banco ancla el saldo de la última fila.
      if (fa.balance !== null && acc.rows.length) acc.rows[acc.rows.length - 1].balance = fa.balance;
    }
    return `Banco conectado: ${added} movimientos nuevos${dup ? `, ${dup} repetidos ignorados` : ''}.`;
  }
  async function runFintoc(connect) {
    if (FINTOC.busy) return;
    FINTOC.busy = true; FINTOC.msg = null; render();
    try {
      if (connect) {
        if (!window.Fintoc) throw new Error('No pudimos cargar el widget de Fintoc. Revisa tu conexión.');
        const { widgetToken, publicKey } = await api('/api/fintoc/link-intent', { method: 'POST', body: '{}' });
        await new Promise((resolve, reject) => {
          const widget = window.Fintoc.create({
            publicKey, widgetToken,
            onSuccess: (li) => { api('/api/fintoc/exchange', { method: 'POST', body: JSON.stringify({ exchangeToken: li.exchangeToken }) }).then(resolve, reject); },
            onExit: () => reject(new Error('__cancel__')),
          });
          if (widget && typeof widget.open === 'function') widget.open();
        });
      }
      const text = await syncFintoc();
      FINTOC.msg = text; FINTOC.busy = false;
      go({ importMsg: { ok: true, text } });
    } catch (e) {
      FINTOC.busy = false;
      if (e.message === '__cancel__') { render(); return; }
      FINTOC.msg = e.message; go({ importMsg: { ok: false, text: e.message } });
    }
  }
  async function importFile(file) {
    try {
      const text = await readFile(file);
      const parsed = FF.parseStatement(text);
      const name = bankShort(S.bank);
      let acc = S.accounts.find((a) => a.bank === S.bank);
      let added = parsed.rows.length, dup = 0;
      if (acc) { const m = FF.mergeRows(acc.rows, parsed.rows); acc.rows = m.rows; added = m.added; dup = m.duplicates; }
      else { if (S.accounts.length >= 3) throw new Error('Ya tienes 3 cuentas. Quita una desde tu perfil para agregar otra.'); S.accounts.push({ id: 'a' + Date.now(), name, bank: S.bank, rows: parsed.rows }); }
      const check = parsed.check ? (parsed.check.ok ? ' · saldo verificado' : ' · ojo: el saldo no cuadra, puede faltar una página') : '';
      S.sample = false;
      go({ importMsg: { ok: true, text: `${name}: ${added} movimientos nuevos${dup ? `, ${dup} repetidos ignorados` : ''}${check}.` } });
    } catch (e) {
      go({ importMsg: { ok: false, text: e.message } });
    }
  }

  // ---------- eventos ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (el.dataset.act === 'close-sheet' && e.target.closest('[data-stop]') && el.classList.contains('scrim')) return;
    const act = el.dataset.act;
    switch (act) {
      case 'go-auth': go({ view: 'auth' }); break;
      case 'go-landing': go({ view: 'landing' }); break;
      case 'login-google': go({ view: 'onboard', step: 1, user: { email: 'cuenta de Google (demo)' } }); break;
      case 'try-sample': loadSample(); break;
      case 'load-sample': loadSample(); break;
      case 'bank': go({ bank: el.dataset.bank, importMsg: null }); break;
      case 'fintoc-connect': runFintoc(true); break;
      case 'fintoc-sync': runFintoc(false); break;
      case 'finish': go({ view: 'app', tab: 'inicio', importMsg: null }); break;
      case 'tab': go({ tab: el.dataset.tab, sheetId: null }); break;
      case 'filter': S.filter = el.dataset.f; render(); break;
      case 'open-tx': pickedScope = null; S.sheetId = el.dataset.id; render(); setTimeout(() => { const b = document.querySelector('.sheet button'); if (b) b.focus(); }, 0); break;
      case 'close-sheet': S.sheetId = null; render(); break;
      case 'pick-scope': pickedScope = el.dataset.scope; document.querySelectorAll('[data-act="pick-scope"]').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); break;
      case 'save-tx': saveTx(); break;
      case 'toast': S.toast = true; render(); setTimeout(() => { S.toast = false; render(); }, 4500); break;
      case 'add-account': go({ view: 'onboard', step: 2, importMsg: null }); break;
      case 'remove-acc': S.accounts = S.accounts.filter((a) => a.id !== el.dataset.id); if (!S.accounts.length) go({ view: 'onboard', step: 2 }); else render(); break;
      case 'export': S.exportOpen = !S.exportOpen; render(); break;
      case 'copy-csv': { const ta = document.getElementById('csv'); const msg = document.getElementById('copy-msg'); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => { msg.textContent = 'Copiado.'; }).catch(() => { ta.select(); msg.textContent = 'Selecciónalo y cópialo con Ctrl+C.'; }); break; }
      case 'ask-delete': S.confirmDelete = true; render(); break;
      case 'cancel-delete': S.confirmDelete = false; render(); break;
      case 'do-delete': fetch('/api/fintoc/link', { method: 'DELETE', credentials: 'same-origin' }).catch(() => {}); S = fresh(); try { localStorage.removeItem(STORE); } catch (err) { /* nada */ } render(); break;
      case 'logout': go({ view: 'landing' }); break;
    }
  });
  function loadSample() {
    S.holder = 'Valentina Rojas Fuentes'; S.consent = true; S.sample = true; S.user = S.user || { email: 'Modo demo' };
    S.accounts = JSON.parse(JSON.stringify(SAMPLE_STATE.accounts)); S.rules = { __tx: {}, __internal: {} };
    go({ view: 'app', tab: 'inicio', importMsg: null });
  }
  function saveTx() {
    const t = D.txs.find((x) => x.id === S.sheetId); if (!t) return;
    const internal = document.getElementById('is-internal').checked;
    const applyAll = document.getElementById('apply-all').checked;
    if (internal !== t.internal) S.rules.__internal[t.id] = internal;
    const scope = pickedScope || t.scope;
    if (!internal && scope !== t.scope) {
      if (applyAll) S.rules[FF.counterpartyKey(t.description)] = scope; else S.rules.__tx[t.id] = scope;
    }
    S.sheetId = null; render();
  }
  document.addEventListener('submit', (e) => {
    const f = e.target.dataset.form; if (!f) return; e.preventDefault();
    if (f === 'login') go({ view: 'onboard', step: 1, user: { email: document.getElementById('email').value } });
    if (f === 'holder') { S.holder = document.getElementById('holder').value.trim(); S.consent = document.getElementById('consent').checked; go({ step: 2 }); }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'q') { S.query = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
    if (e.target.id === 'is-internal') { const b = document.getElementById('scope-block'); if (b) b.style.opacity = e.target.checked ? '.4' : '1'; }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'file' && e.target.files[0]) importFile(e.target.files[0]);
    if (e.target.id === 'accf') { S.accFilter = e.target.value; render(); }
    if (e.target.id === 'minimum') { const v = Math.max(0, Number(e.target.value) || 0); S.minimum = v; render(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheetId) { S.sheetId = null; render(); } });

  render();
})();

</script>
</body>
</html>
