<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>FinFlow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
/* Diseño: Bootstrap 5.3 tal cual. Aquí va solo lo que Bootstrap no trae. */
:root {
  /* Colores que usa el gráfico (SVG), tomados de Bootstrap. */
  --bg: var(--bs-body-bg);
  --line: var(--bs-border-color);
  --muted: var(--bs-secondary-color);
  --faint: var(--bs-secondary-color);
  --accent: var(--bs-primary);
  --warn: var(--bs-warning);
  --danger: var(--bs-danger);
}
.num { font-variant-numeric: tabular-nums; }
.faint { color: var(--bs-secondary-color); }
section[id] { scroll-margin-top: 70px; }

/* Logo e íconos */
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--bs-primary); display: inline-grid; place-items: center; flex-shrink: 0; }
.brand-mark svg { width: 18px; height: 18px; }
.btn svg, .badge svg, .nav-link svg, .icon svg { width: 1.1em; height: 1.1em; flex-shrink: 0; }
.icon { display: inline-flex; }

/* App: menú lateral en escritorio, barra inferior en celular */
.sidebar { min-height: calc(100vh - 56px); }
.sidebar .nav-link { color: var(--bs-body-color); text-align: left; }
.sidebar .nav-link.active { color: #fff; }
.bottom-nav .nav-link { color: var(--bs-secondary-color); font-size: .72rem; padding: .5rem 0; }
.bottom-nav .nav-link svg { width: 20px; height: 20px; }
.bottom-nav .nav-link.active { color: var(--bs-primary); }
@media (max-width: 991.98px) { .app-main { padding-bottom: 5.5rem !important; } }

/* Subir cartola */
.dropzone { border: 2px dashed var(--bs-border-color); border-radius: var(--bs-border-radius); cursor: pointer; }
.dropzone.over { border-color: var(--bs-primary); background: var(--bs-primary-bg-subtle); }

/* Movimientos */
.tx-amt.pos { color: var(--bs-success); }
.is-internal .tx-amt { color: var(--bs-secondary-color); text-decoration: line-through; }
/* Calendario de gastos */
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-btn { min-height: 56px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--bs-border-color); line-height: 1.2; }
.cal-amt { font-size: .68rem; opacity: .85; }
.cal-sel { outline: 2px solid var(--bs-body-color); outline-offset: 1px; }
.cal-key { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

/* Botón de modo oscuro: sobre la barra inferior en el celular */
.theme-btn { bottom: 0; z-index: 1040; width: 42px; height: 42px; padding: 0; display: grid; place-items: center; background: var(--bs-body-bg); color: var(--bs-body-color); }
.theme-btn:hover { background: var(--bs-tertiary-bg); color: var(--bs-body-color); }
.theme-btn svg { width: 20px; height: 20px; }
@media (max-width: 991.98px) { .theme-btn { bottom: 4rem; } }
.qr-box { width: 112px; height: 112px; flex-shrink: 0; display: grid; place-items: center; }
.qr-box img, .qr-box canvas { width: 96px !important; height: 96px !important; }

/* Gráfico de proyección */
.chart-wrap { width: 100%; overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; min-width: 300px; height: auto; }
.chart-int { position: relative; }
.ff-chart { touch-action: pan-y; }
.ff-chart .ff-hit { cursor: crosshair; }
.ff-min, .ff-chart.dragging { cursor: ns-resize; }
.ff-tip { position: absolute; z-index: 5; pointer-events: none; min-width: 190px; max-width: 260px; background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: var(--bs-border-radius); padding: .5rem .75rem; font-size: .8rem; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--bs-box-shadow-sm); }
.ff-tip[hidden] { display: none; }
.tip-warn { color: var(--bs-warning-text-emphasis); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; }
.ff-chart.anim .ff-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ff-draw 1s ease .1s forwards; }
.ff-chart.anim .ff-band { animation: ff-fade .8s ease .3s both; }
@keyframes ff-draw { to { stroke-dashoffset: 0; } }
@keyframes ff-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<script>
/* Modo claro/oscuro de Bootstrap (data-bs-theme). Se aplica antes de dibujar para que no parpadee. */
(function () {
  var t = null;
  try { t = localStorage.getItem('finflow-tema'); } catch (e) { /* sin almacenamiento */ }
  if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-bs-theme', t);
})();
</script>

<script>
(function () {
  var btn = document.getElementById('tema');
  var sol = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>';
  var luna = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
  function pintar() {
    var oscuro = document.documentElement.getAttribute('data-bs-theme') === 'dark';
    btn.innerHTML = oscuro ? sol : luna;
    btn.title = oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
    btn.setAttribute('aria-label', btn.title);
  }
  btn.addEventListener('click', function () {
    var nuevo = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-bs-theme', nuevo);
    try { localStorage.setItem('finflow-tema', nuevo); } catch (e) { /* sin almacenamiento */ }
    pintar();
  });
  pintar();
})();
</script>

<script>
/* Lógica de FinFlow (corre en el navegador).
   Importación de cartolas CSV, clasificación Negocio/Personal con reglas y motivo,
   transferencias internas, resumen del mes y proyección a 4 semanas. */
(function (root) {
  'use strict';

  // utilidades
  const strip = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
  const DAY = 86400000;
  const toDate = (iso) => new Date(iso + 'T12:00:00');
  const iso = (d) => d.toISOString().slice(0, 10);
  const addDays = (isoStr, n) => iso(new Date(toDate(isoStr).getTime() + n * DAY));
  const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / DAY);

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // lectura CSV
  function splitLine(line, delim) {
    const out = []; let cur = ''; let q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { q = !q; continue; }
      if (c === delim && !q) { out.push(cur); cur = ''; continue; }
      cur += c;
    }
    out.push(cur);
    return out.map((x) => x.trim());
  }

  function parseAmount(text) {
    let s = String(text || '').replace(/\$/g, '').replace(/\s/g, '');
    if (!s) return 0;
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^-?\d+,\d{1,2}$/.test(s)) s = s.replace(',', '.');
    const n = Number(s);
    if (Number.isNaN(n)) throw new Error('Monto no reconocido: "' + text + '"');
    return Math.round(n);
  }

  function parseDate(text) {
    const s = String(text || '').trim();
    let m = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    throw new Error('Fecha no reconocida: "' + text + '"');
  }

  const COLS = {
    date: /^(FECHA|FECHA OPERACION|FECHA MOVIMIENTO|DATE)$/,
    desc: /^(DESCRIPCION|DETALLE|GLOSA|CONCEPTO|DESCRIPCION MOVIMIENTO|DETALLE DE TRANSACCION)$/,
    debit: /^(CARGO|CARGOS|DEBITO|DEBITOS|MONTO CARGOS)$/,
    credit: /^(ABONO|ABONOS|DEPOSITO|DEPOSITOS|CREDITO|CREDITOS|MONTO ABONOS)$/,
    amount: /^(MONTO|IMPORTE|AMOUNT)$/,
    balance: /^(SALDO|SALDO DISPONIBLE|BALANCE)$/,
  };

  // Lee una cartola CSV. Devuelve filas en orden cronológico y el resultado de la validación de saldo.
  function parseStatement(text) {
    const lines = String(text).replace(/^﻿/, '').split(/\r?\n/).filter((l) => l.trim());
    if (lines.length < 2) throw new Error('El archivo no tiene movimientos.');
    const delim = (lines[0].split(';').length >= lines[0].split(',').length) ? ';' : ',';
    const header = splitLine(lines[0], delim).map(strip);
    const idx = {};
    for (const [key, re] of Object.entries(COLS)) idx[key] = header.findIndex((h) => re.test(h));
    if (idx.date < 0 || idx.desc < 0 || (idx.amount < 0 && idx.debit < 0 && idx.credit < 0)) {
      const e = new Error('No reconocemos las columnas de esta cartola. Necesitamos fecha, descripción y monto.');
      e.code = 'unknown_format';
      throw e;
    }
    const rows = lines.slice(1).map((line, i) => {
      const c = splitLine(line, delim);
      const amount = idx.amount >= 0
        ? parseAmount(c[idx.amount])
        : parseAmount(c[idx.credit]) - Math.abs(parseAmount(c[idx.debit]));
      return {
        date: parseDate(c[idx.date]),
        description: (c[idx.desc] || '').replace(/\s+/g, ' ').trim(),
        amount,
        balance: idx.balance >= 0 && c[idx.balance] ? parseAmount(c[idx.balance]) : null,
        _line: i,
      };
    });
    // Orden cronológico estable (algunos bancos exportan del más nuevo al más antiguo).
    if (rows.length > 1 && rows[0].date > rows[rows.length - 1].date) rows.reverse();
    let check = null;
    if (rows[0].balance !== null && rows[rows.length - 1].balance !== null) {
      const opening = rows[0].balance - rows[0].amount;
      const computed = opening + rows.reduce((s, r) => s + r.amount, 0);
      check = { opening, closing: rows[rows.length - 1].balance, ok: computed === rows[rows.length - 1].balance };
    }
    return { rows, check, delimiter: delim };
  }

  // clasificación
  const RULES = [
    // [regex sobre la glosa, ámbito, motivo]
    [/ARRIENDO DEPTO|ARRIENDO CASA|DIVIDENDO/, 'personal', 'arriendo de vivienda'],
    [/LIDER|JUMBO|SANTA ISABEL|UNIMARC|TOTTUS|ACUENTA/, 'personal', 'supermercado'],
    [/FARMACIA|CRUZ VERDE|SALCOBRAND|AHUMADA/, 'personal', 'farmacia'],
    [/NETFLIX|SPOTIFY|DISNEY|HBO|CINEMARK|CINEPLANET/, 'personal', 'entretención'],
    [/PEDIDOSYA|RAPPI|UBER EATS|RESTAUR/, 'personal', 'comida'],
    [/MOVISTAR|ENTEL|CLARO|WOM|ENEL|AGUAS|METROGAS|CGE/, 'personal', 'servicios del hogar'],
    [/\bUBER\b|DIDI|CABIFY/, 'personal', 'transporte'],
    [/ADOBE|CANVA|FIGMA|NOTION|GOOGLE WORKSPACE|HOSTING|DOMINIO/, 'negocio', 'herramienta de trabajo'],
    [/COWORK/, 'negocio', 'espacio de trabajo'],
    [/LINK DE PAGO|COBRO|BOLETA|HONORARIO/, 'negocio', 'cobro a cliente'],
    [/\bSII\b|TESORERIA|IMPOSICION/, 'negocio', 'impuestos'],
  ];
  const COMPANY = /\b(SPA|LTDA|LIMITADA|EIRL|S\.?A\.?)\b/;

  // Clave de contraparte para las reglas personales: glosa sin números ni prefijos.
  function counterpartyKey(description) {
    return strip(description)
      .replace(/^(PAGO EN|PAGO|COMPRA|PAC|TRANSF(ERENCIA)?( RECIBIDA| ENVIADA)? (DE|A)|COBRO)\s+/, '')
      .replace(/\d+/g, '').replace(/\s+/g, ' ').trim();
  }

  function classify(tx, userRules) {
    const key = counterpartyKey(tx.description);
    if (userRules && typeof userRules[key] === 'string') { const r = RULES.find(([re]) => re.test(strip(tx.description))); return { scope: userRules[key], tag: r ? r[2] : undefined, reason: 'tu corrección anterior', source: 'user', review: false }; }
    const g = strip(tx.description);
    for (const [re, scope, why] of RULES) {
      const m = g.match(re);
      if (m) return { scope, tag: why, reason: `por la glosa: ${m[0].trim()} (${why})`, source: 'rule', review: false };
    }
    if (tx.amount > 0 && COMPANY.test(g)) return { scope: 'negocio', reason: 'te pagó una empresa', source: 'rule', review: false };
    if (tx.amount > 0 && /TRANSF/.test(g)) return { scope: 'personal', reason: 'transferencia de una persona', source: 'rule', review: true };
    return { scope: 'personal', reason: 'sin coincidencias: revísalo', source: 'rule', review: true };
  }

  function category(scope, amount) {
    if (scope === 'negocio') return amount >= 0 ? 'ingreso_negocio' : 'gasto_operacional';
    return amount >= 0 ? 'ingreso_personal' : 'gasto_personal';
  }

  // transferencias internas
  function holderTokens(name) { return strip(name).split(/\s+/).filter((t) => t.length >= 3); }
  const TRANSFER = /TRASP|TRANSF|TEF/;

  function markInternal(txs, holderName) {
    const holder = holderTokens(holderName);
    for (const t of txs) {
      if (t.manualInternal !== undefined) { t.internal = t.manualInternal; continue; }
      t.internal = false;
      const g = strip(t.description);
      if (TRANSFER.test(g)) {
        const hits = holder.filter((h) => g.includes(h)).length;
        if (hits >= Math.min(2, holder.length)) { t.internal = true; t.internalReason = 'el titular eres tú'; }
      }
    }
    // Entre cuentas: mismo monto (signo opuesto), cuentas distintas, ±1 día.
    const open = txs.filter((t) => !t.internal && t.manualInternal === undefined && TRANSFER.test(strip(t.description)));
    for (const a of open) {
      if (a.internal || a.amount >= 0) continue;
      const b = open.find((x) => !x.internal && x !== a && x.account !== a.account && x.amount === -a.amount && Math.abs(diffDays(a.date, x.date)) <= 1);
      if (b) { a.internal = b.internal = true; a.internalReason = b.internalReason = 'el mismo monto llegó a tu otra cuenta'; }

  }

  // armado de movimientos
  function buildTransactions(accounts, holderName, userRules) {
    const txs = [];
    for (const acc of accounts) {
      for (const r of acc.rows) {
        txs.push({ id: `${acc.id}:${r.date}:${r._line}`, account: acc.id, accountName: acc.name, ...r });
      }
    }
    txs.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a._line - b._line));
    const manual = (userRules && userRules.__internal) || {};
    for (const t of txs) if (manual[t.id] !== undefined) t.manualInternal = manual[t.id];
    markInternal(txs, holderName);
    for (const t of txs) {
      Object.assign(t, classify(t, userRules));
      const one = userRules && userRules.__tx && userRules.__tx[t.id];
      if (one) Object.assign(t, { scope: one, reason: 'corregido por ti', source: 'user', review: false });
      if (t.internal) t.review = false;
      t.category = category(t.scope, t.amount);

  }

  // Une filas nuevas a una cuenta, sin duplicados (misma fecha, glosa, monto y orden en el día).
  function mergeRows(existing, incoming) {
    const key = (r, n) => `${r.date}|${strip(r.description)}|${r.amount}|${n}`;
    const count = {};
    const keys = new Set(existing.map((r) => { const b = `${r.date}|${strip(r.description)}|${r.amount}`; count[b] = (count[b] || 0) + 1; return key(r, count[b]); }));
    const seen = {};
    const added = [];
    let maxLine = existing.reduce((m, r) => Math.max(m, r._line), -1);
    for (const r of incoming) {
      const b = `${r.date}|${strip(r.description)}|${r.amount}`;
      seen[b] = (seen[b] || 0) + 1;
      if (!keys.has(key(r, seen[b]))) added.push({ ...r, _line: ++maxLine });
    }
    const rows = existing.concat(added).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a._line - b._line));
    return { rows, added: added.length, duplicates: incoming.length - added.length };
  }

  // resumen
  function monthKey(isoStr) { return isoStr.slice(0, 7); }

  function monthSummary(txs, ym) {
    const s = { ym, ingreso_negocio: 0, gasto_operacional: 0, ingreso_personal: 0, gasto_personal: 0, internal: 0, internalCount: 0 };
    for (const t of txs) {
      if (monthKey(t.date) !== ym) continue;
      if (t.internal) { if (t.amount > 0) { s.internal += t.amount; s.internalCount++; } continue; }
      s[t.category] += Math.abs(t.amount);
    }
    s.utilidad = s.ingreso_negocio - s.gasto_operacional;
    return s;
  }

  function topExpense(txs, ym, scope) {
    const by = {};
    for (const t of txs) {
      if (t.internal || monthKey(t.date) !== ym || t.scope !== scope || t.amount >= 0) continue;
      const k = counterpartyKey(t.description);
      by[k] = (by[k] || 0) + -t.amount;
    }
    const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
    return top ? { name: top[0], amount: top[1] } : null;
  }

  function balances(accounts) {
    return accounts.map((a) => {
      const last = a.rows[a.rows.length - 1];
      const opening = a.rows[0].balance !== null ? a.rows[0].balance - a.rows[0].amount : 0;
      const bal = last && last.balance !== null ? last.balance : opening + a.rows.reduce((s, r) => s + r.amount, 0);
      return { id: a.id, name: a.name, balance: bal, lastDate: last ? last.date : null };
    });
  }

  // proyección
  // Detecta movimientos que se repiten cada mes (≥3 meses, monto parecido, día parecido).
  function recurring(txs) {
    const groups = {};
    const allMonths = new Set(txs.map((t) => monthKey(t.date))).size;
    for (const t of txs) {
      if (t.internal) continue;
      const k = counterpartyKey(t.description) + (t.amount > 0 ? '+' : '-');
      (groups[k] = groups[k] || []).push(t);
    }
    const out = [];
    for (const [k, list] of Object.entries(groups)) {
      const months = new Set(list.map((t) => monthKey(t.date)));
      if (months.size < 3 || months.size < allMonths * 0.75 || list.length > months.size + 1) continue;
      const amts = list.map((t) => Math.abs(t.amount));
      const mean = amts.reduce((a, b) => a + b, 0) / amts.length;
      const sd = Math.sqrt(amts.reduce((a, b) => a + (b - mean) ** 2, 0) / amts.length);
      if (sd / mean > 0.25) continue;
      const days = list.map((t) => Number(t.date.slice(8, 10))).sort((a, b) => a - b);
      const day = days[Math.floor(days.length / 2)];
      out.push({ key: k, name: counterpartyKey(list[0].description), sign: list[0].amount > 0 ? 1 : -1, amount: Math.round(mean), day, scope: list[0].scope, months: months.size, ids: new Set(list.map((t) => t.id)) });
    }
    return out;
  }

  function quantile(sorted, q) {
    const pos = (sorted.length - 1) * q; const lo = Math.floor(pos); const hi = Math.ceil(pos);
    return Math.round(sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo));
  }

  // Proyección a 4 semanas: saldo de hoy + movimientos fijos en su fecha + el resto proyectado por semana.
  // Para el rango se repite el cálculo 200 veces con la variación real de la historia.
  function project(txs, startBalance, today, minimum, opts = {}) {
    const weeks = 4;
    const hist = txs.filter((t) => !t.internal && t.date <= today);
    const first = hist.length ? hist[0].date : today;
    const historyDays = diffDays(first, today);
    const rec = recurring(hist);
    const recIds = new Set(); rec.forEach((r) => r.ids.forEach((id) => recIds.add(id)));

    // Flujo semanal no recurrente, semanas completas hacia atrás desde hoy.
    const nWeeks = Math.max(1, Math.floor(historyDays / 7));
    const weekly = new Array(nWeeks).fill(0);
    for (const t of hist) {
      if (recIds.has(t.id)) continue;
      const w = Math.floor(diffDays(t.date, today) / 7);
      if (w < nWeeks) weekly[nWeeks - 1 - w] += t.amount;
    }
    // Holt: nivel + tendencia (alpha 0.3, beta 0.05).
    const a = 0.3, b = 0.05;

      const f = level + trend; errors.push(weekly[i] - f);
      const prev = level; level = a * weekly[i] + (1 - a) * (level + trend); trend = b * (level - prev) + (1 - b) * trend;
    }

    // Recurrentes que caen en las próximas 4 semanas.
    const upcoming = [];
    for (let d = 1; d <= weeks * 7; d++) {
      const date = addDays(today, d); const dom = Number(date.slice(8, 10));
      for (const r of rec) if (r.day === dom) upcoming.push({ date, name: r.name, amount: r.sign * r.amount, scope: r.scope, week: Math.ceil(d / 7) });
    }
    const recByWeek = [0, 0, 0, 0];
    upcoming.forEach((u) => { recByWeek[u.week - 1] += u.amount; });

    const enough = historyDays >= 84; // ~3 meses (regla del proyecto)
    const rand = mulberry32(opts.seed || 2026);
    const sims = 200;
    const paths = [];
    for (let s = 0; s < sims; s++) {
      let bal = startBalance; const p = [];
      for (let w = 0; w < weeks; w++) {
        const base = enough ? level + trend * (w + 1) : 0;
        const noise = enough && errors.length ? errors[Math.floor(rand() * errors.length)] : 0;
        bal += recByWeek[w] + base + noise;
        p.push(bal);
      }
      paths.push(p);
    }
    const points = [];
    for (let w = 0; w < weeks; w++) {
      const vals = paths.map((p) => p[w]).sort((x, y) => x - y);
      const below = vals.filter((v) => v < minimum).length / sims;
      points.push({ week: w + 1, end: addDays(today, (w + 1) * 7), start: addDays(today, w * 7 + 1), p10: quantile(vals, 0.1), p50: quantile(vals, 0.5), p90: quantile(vals, 0.9), below, belowOf20: Math.round(below * 20) });
    }
    // Gasto personal diario promedio (últimos 90 días) para expresar "días cubiertos".
    const since = addDays(today, -90);
    const personalSpend = hist.filter((t) => t.date > since && t.scope === 'personal' && t.amount < 0).reduce((s, t) => s - t.amount, 0);
    const dailyPersonal = Math.max(1, Math.round(personalSpend / 90));
    const worst = points.reduce((m, p) => (p.belowOf20 > m.belowOf20 || (p.belowOf20 === m.belowOf20 && p.p50 < m.p50) ? p : m), points[0]);
    const alert = enough && (worst.p50 < minimum || worst.belowOf20 >= 3)
      ? { week: worst.week, start: worst.start, end: worst.end, amount: worst.p50, belowOf20: Math.max(1, worst.belowOf20), daysCovered: Math.max(0, Math.floor(worst.p50 / dailyPersonal)) }
      : null;
    return { today, startBalance, minimum, enough, historyDays, points, upcoming, recurring: rec, dailyPersonal, alert };
  }

  // resumen inteligente (reglas, sin modelo de lenguaje)
  const fmt = (n) => '$' + Math.round(Math.abs(n)).toLocaleString('es-CL');
  const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const monthName = (ym) => MONTHS[Number(ym.slice(5, 7)) - 1];
  const prevMonth = (ym) => { const [y, m] = ym.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`; };

  function smartSummary(txs, ym, projection) {
    const cur = monthSummary(txs, ym); const prev = monthSummary(txs, prevMonth(ym));
    const out = [];
    if (cur.ingreso_negocio === 0) {
      out.push(`En ${monthName(ym)} no registraste ingresos del negocio. Pasa en meses de transición; la proyección ya lo considera.`);
    } else {
      const change = prev.utilidad ? Math.round(((cur.utilidad - prev.utilidad) / Math.abs(prev.utilidad)) * 100) : null;
      out.push(`Tu negocio dejó ${fmt(cur.utilidad)} en ${monthName(ym)}` + (change === null ? '.' : `, ${Math.abs(change)} % ${change >= 0 ? 'más' : 'menos'} que en ${monthName(prev.ym)}.`));
    }
    const top = topExpense(txs, ym, 'negocio');
    if (top) out.push(`Tu mayor gasto del negocio fue ${titleCase(top.name)} (${fmt(top.amount)}).`);
    if (projection && projection.alert) {
      const inc = projection.upcoming.find((u) => u.amount > 0 && u.week > projection.alert.week - 1);
      out.push(inc
        ? `La semana del ${shortDate(projection.alert.start)} podrías bajar de tu mínimo. El pago de ${titleCase(inc.name)} (${fmt(inc.amount)}) llega el ${shortDate(inc.date)}; si lo cobras antes, no bajas.`
        : `La semana del ${shortDate(projection.alert.start)} podrías bajar de tu mínimo. Adelantar un cobro o mover un gasto te da margen.`);
    } else if (projection) {
      out.push('Tu saldo se mantiene sobre tu mínimo las próximas 4 semanas.');
    }
    return out;
  }
  function titleCase(s) { return s.toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase()).replace(/\b(Spa|Ltda|Eirl)\b/g, (x) => x.toUpperCase()); }
  function shortDate(isoStr) { const d = toDate(isoStr); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; }

  // exportar
  function toCSV(txs) {
    const head = 'fecha,cuenta,descripcion,monto,ambito,categoria,transferencia_interna';
    const esc = (v) => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
    return [head].concat(txs.map((t) => [t.date, t.accountName, t.description, t.amount, t.scope, t.category, t.internal ? 1 : 0].map(esc).join(','))).join('\n');
  }

  root.FF = { parseStatement, parseAmount, parseDate, mergeRows, buildTransactions, classify, counterpartyKey, category, markInternal, monthSummary, topExpense, balances, recurring, project, smartSummary, toCSV, fmt, monthName, prevMonth, shortDate, titleCase, addDays, diffDays, monthKey };
})(typeof window !== 'undefined' ? window : globalThis);

  const SAMPLE_STATE = (() => {

  // gráfico de proyección
  // Registro de gráficos dibujados (para tooltip y arrastre del mínimo).
  const CHARTS = {}; let chartSeq = 0; let animateNext = true;
  function chart(d, opts = {}) {
    const p = d.proj; const W = opts.w || 640; const H = opts.h || 260;
    const padL = opts.compact ? 8 : 64, padR = opts.compact ? 16 : 28, padT = 18, padB = 30;
    const xs = [0, 1, 2, 3, 4].map((i) => padL + (i * (W - padL - padR)) / 4);
    const all = [p.startBalance, p.minimum].concat(p.points.flatMap((q) => [q.p10, q.p90]));
    let lo = Math.min(...all), hi = Math.max(...all); const span = hi - lo || 1; lo -= span * 0.08; hi += span * 0.08;
    const y = (v) => padT + ((hi - v) / (hi - lo)) * (H - padT - padB);
    const med = [p.startBalance].concat(p.points.map((q) => q.p50));
    const up = [p.startBalance].concat(p.points.map((q) => q.p90));
    const dn = [p.startBalance].concat(p.points.map((q) => q.p10));
    const band = up.map((v, i) => `${xs[i]},${y(v)}`).join(' ') + ' ' + dn.map((v, i) => `${xs[i]},${y(v)}`).reverse().join(' ');
    const line = med.map((v, i) => `${xs[i]},${y(v)}`).join(' ');
    const ym = y(p.minimum);
    let ticks = '';
    if (!opts.compact) {
      const raw = (hi - lo) / 3; const mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((m) => m >= raw);
      for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) { ticks += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${kfmt(v)}</text>`; }
    }
    const labels = ['Hoy'].concat(p.points.map((q) => (opts.compact ? `S${q.week}` : `Sem ${q.week}`)));
    const fs = opts.compact ? 14 : 11;
    const xl = labels.map((l, i) => `<text x="${xs[i]}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}" font-size="${fs}" fill="var(--muted)">${l}</text>`).join('');
    const a = p.alert;
    const dot = a ? `<circle class="ff-pulse" cx="${xs[a.week]}" cy="${y(med[a.week])}" r="6" fill="var(--bg)" stroke="var(--warn)" stroke-width="3"/>` : '';
    const id = 'c' + (++chartSeq);
    CHARTS[id] = { p, xs, W, H, padL, padR, padT, padB, lo, hi, med, compact: !!opts.compact };
    const fixedMin = opts.compact || opts.noDrag;
    const drag = fixedMin ? '' : `<g class="ff-min" data-chart="${id}">
        <line class="ff-min-hit" x1="${padL}" x2="${W - padR}" y1="${ym}" y2="${ym}" stroke="transparent" stroke-width="22"/>
        <line class="ff-min-line" x1="${padL}" x2="${W - padR}" y1="${ym}" y2="${ym}" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="5 5" pointer-events="none"/>
        <circle class="ff-min-knob" cx="${W - padR}" cy="${ym}" r="8" fill="var(--bg)" stroke="var(--danger)" stroke-width="2" pointer-events="none"/>
        <text class="ff-min-label" x="${W - padR - 14}" y="${ym - 8}" text-anchor="end" font-size="11" fill="var(--danger)" pointer-events="none">Tu mínimo ${fmt(p.minimum)} · arrastra</text>
      </g>`;
    const minStatic = fixedMin ? `<line x1="${padL}" x2="${W - padR}" y1="${ym}" y2="${ym}" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="5 5"/>
      <text x="${W - padR}" y="${ym - 6}" text-anchor="end" font-size="${opts.compact ? 14 : 11}" fill="var(--danger)">Tu mínimo ${fmt(p.minimum)}</text>` : '';
    return `<div class="chart-int"><svg class="ff-chart ${animateNext ? 'anim' : ''}" data-chart="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de saldo a 4 semanas: hoy ${fmt(p.startBalance)}; ${p.points.map((q) => `semana ${q.week} ${fmt(q.p50)}`).join(', ')}.">
      ${ticks}
      <polygon class="ff-band" points="${band}" fill="var(--accent)" fill-opacity="0.14"/>
      ${minStatic}
      <line class="ff-guide" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4" visibility="hidden"/>
      <polyline class="ff-line" pathLength="1" points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      ${med.map((v, i) => `<circle class="ff-pt" cx="${xs[i]}" cy="${y(v)}" r="3.5" fill="var(--accent)"/>`).join('')}
      ${dot}${xl}
      <circle class="ff-hover" r="7" fill="var(--accent)" stroke="var(--bg)" stroke-width="3" visibility="hidden"/>
      <rect class="ff-hit" data-chart="${id}" x="${padL - 10}" y="${padT}" width="${W - padL - padR + 20}" height="${H - padT - padB}" fill="transparent"/>
      ${drag}
    </svg><div class="ff-tip" hidden></div></div>`;
  }

  // Tooltip: semana más cercana al puntero.
  function chartPoint(svg, evt) {
    const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function showTip(svg, evt) {
    const c = CHARTS[svg.dataset.chart]; if (!c) return;
    const { x } = chartPoint(svg, evt);
    let i = 0; c.xs.forEach((xx, k) => { if (Math.abs(xx - x) < Math.abs(c.xs[i] - x)) i = k; });
    const yv = c.padT + ((c.hi - c.med[i]) / (c.hi - c.lo)) * (c.H - c.padT - c.padB);
    const g = svg.querySelector('.ff-guide'); g.setAttribute('x1', c.xs[i]); g.setAttribute('x2', c.xs[i]); g.setAttribute('visibility', 'visible');
    const h = svg.querySelector('.ff-hover'); h.setAttribute('cx', c.xs[i]); h.setAttribute('cy', yv); h.setAttribute('visibility', 'visible');
    const tip = svg.parentElement.querySelector('.ff-tip');
    let html;
    if (i === 0) html = `<strong>Hoy</strong><span class="num">${fmt(c.p.startBalance)}</span><span class="faint">Saldo actual en tus cuentas</span>`;
    else {
      const q = c.p.points[i - 1];
      const items = c.p.upcoming.filter((u) => u.week === q.week).slice(0, 3);
      html = `<strong>Semana ${q.week} · ${FF.shortDate(q.start)} al ${FF.shortDate(q.end)}</strong>
        <span>Más probable <b class="num">${fmt(q.p50)}</b></span>
        <span class="faint num">Rango ${fmt(q.p10)} a ${fmt(q.p90)}</span>
        <span class="${q.belowOf20 >= 3 ? 'tip-warn' : 'faint'}">${q.belowOf20} de 20 escenarios bajo tu mínimo</span>
        ${items.map((u) => `<span class="faint">${FF.shortDate(u.date)} · ${esc(FF.titleCase(u.name))} <span class="num">${signed(u.amount)}</span></span>`).join('')}`;
    }
    tip.innerHTML = html; tip.hidden = false;
    const rect = svg.getBoundingClientRect(); const left = (c.xs[i] / c.W) * rect.width;
    tip.style.left = Math.max(8, Math.min(rect.width - tip.offsetWidth - 8, left - tip.offsetWidth / 2)) + 'px';
    tip.style.top = Math.max(0, (yv / c.H) * rect.height - tip.offsetHeight - 14) + 'px';
  }
  function hideTip(svg) {
    if (!svg) return;
    svg.querySelector('.ff-guide').setAttribute('visibility', 'hidden');
    svg.querySelector('.ff-hover').setAttribute('visibility', 'hidden');
    const tip = svg.parentElement.querySelector('.ff-tip'); if (tip) tip.hidden = true;
  }
  let dragging = null;
  function minFromEvent(svg, evt) {
    const c = CHARTS[svg.dataset.chart]; const { y } = chartPoint(svg, evt);
    const v = c.hi - ((y - c.padT) / (c.H - c.padT - c.padB)) * (c.hi - c.lo);
    return Math.max(0, Math.round(Math.min(c.hi, Math.max(c.lo, v)) / 10000) * 10000);
  }
  function moveMin(svg, v) {
    const c = CHARTS[svg.dataset.chart]; const yy = c.padT + ((c.hi - v) / (c.hi - c.lo)) * (c.H - c.padT - c.padB);
    svg.querySelectorAll('.ff-min-hit, .ff-min-line').forEach((l) => { l.setAttribute('y1', yy); l.setAttribute('y2', yy); });
    svg.querySelector('.ff-min-knob').setAttribute('cy', yy);
    const t = svg.querySelector('.ff-min-label'); t.setAttribute('y', yy - 8); t.textContent = `Tu mínimo ${fmt(v)}`;
  }
  document.addEventListener('pointerdown', (e) => {
    if (e.target.classList && e.target.classList.contains('ff-hit')) { showTip(e.target.ownerSVGElement, e); return; }
    const g = e.target.closest('.ff-min'); if (!g) return;
    const svg = g.ownerSVGElement; e.preventDefault();
    dragging = { svg, value: minFromEvent(svg, e) }; svg.classList.add('dragging'); hideTip(svg);
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* nada */ }
    moveMin(svg, dragging.value);
  });
  document.addEventListener('pointermove', (e) => {
    if (dragging) { dragging.value = minFromEvent(dragging.svg, e); moveMin(dragging.svg, dragging.value); return; }
    const svg = e.target.closest && e.target.closest('svg.ff-chart');
    document.querySelectorAll('svg.ff-chart').forEach((s) => { if (s !== svg) hideTip(s); });
    if (svg && e.target.classList.contains('ff-hit')) showTip(svg, e);
  });
  document.addEventListener('pointerup', () => {
    if (!dragging) return;
    const v = dragging.value; dragging.svg.classList.remove('dragging'); dragging = null;
    S.minimum = v; animateNext = false; render();
  });

  // Números que suben al cargar.
  function countUp() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('[data-count]').forEach((el) => {
      const target = Number(el.dataset.count); const t0 = performance.now(); const dur = 900;
      const tick = (t) => { const k = Math.min(1, (t - t0) / dur); const e = 1 - Math.pow(1 - k, 3); el.textContent = (target < 0 ? '−' : '') + fmt(target * e); if (k < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
  }

  function phrase(p) {

  }

  // app
  const TABS = [['inicio', 'Inicio', I.home], ['movimientos', 'Movimientos', I.list], ['proyeccion', 'Proyección', I.chart], ['calendario', 'Calendario', I.cal], ['perfil', 'Perfil', I.user]];

  function firstName() { return (S.holder || (S.user && S.user.name) || '').split(' ')[0] || 'hola'; }

  // Asistente "Pregúntale a FinFlow"
  const AI = { enabled: false, busy: false, q: '', answer: '', error: '' };
  // Lo que recibe el asistente: solo totales ya calculados. Los pagos fijos llevan nombre solo si son
  // comercios conocidos (Netflix, Enel...); el resto va sin nombre para no mandar personas.
  function aiSummary() {
    const d = D; const p = d.proj;
    const tagOf = {}; for (const t of d.txs) if (t.tag) tagOf[FF.counterpartyKey(t.description)] = t.tag;
    const month = (ym) => {
      const s = FF.monthSummary(d.txs, ym);
      return { mes: FF.monthName(ym), ingresos_negocio: s.ingreso_negocio, gastos_negocio: s.gasto_operacional, utilidad_negocio: s.utilidad, ingresos_personales: s.ingreso_personal, gastos_personales: s.gasto_personal, gastos_por_categoria: spendByTag(d.txs, ym).map((t) => ({ categoria: t.name, total: t.total })) };
    };
    return {
      fecha_de_los_datos: d.today,
      saldo_total: d.total,
      cuentas: d.bals.map((b) => ({ cuenta: b.name, saldo: b.balance })),
      minimo_que_quiere_mantener: p.minimum,
      puede_gastar_por_dia: dailyPlan(d).perDay,
      gasto_personal_promedio_por_dia: p.dailyPersonal,
      mes_en_curso: month(FF.monthKey(d.today)),
      meses_anteriores: [month(d.ym), month(FF.prevMonth(d.ym))],
      fijos_proximas_4_semanas: p.upcoming.map((u) => ({ fecha: u.date, que: tagOf[FF.counterpartyKey(u.name)] ? FF.titleCase(u.name) : (u.amount > 0 ? 'ingreso fijo de un cliente' : 'pago fijo'), monto: u.amount })),
      proyeccion_4_semanas: p.points.map((q) => ({ semana: q.week, desde: q.start, hasta: q.end, saldo_probable: Math.round(q.p50), rango: [Math.round(q.p10), Math.round(q.p90)] })),
      alerta: p.alert ? `podría bajar del mínimo la semana del ${FF.shortDate(p.alert.start)}, llegando a ${fmt(p.alert.amount)}` : 'sin alerta',
    };
  }
  function askCard() {
    if (!AI.enabled) return '';
    const ideas = ['¿Cuánto gasté en supermercado el mes pasado?', '¿Me alcanza para pagar el arriendo?', '¿Cómo le fue a mi negocio?'];
    return `<div class="card">
      <div class="card-header">Pregúntale a FinFlow</div>
      <div class="card-body">
        <form class="input-group mb-2" data-form="ask">
          <input class="form-control" id="ask-q" maxlength="300" required placeholder="Escribe tu pregunta" aria-label="Pregunta" value="${esc(AI.q)}" ${AI.busy ? 'disabled' : ''}>
          <button class="btn btn-primary" type="submit" ${AI.busy ? 'disabled' : ''}>${AI.busy ? 'Pensando…' : 'Preguntar'}</button>
        </form>
        ${AI.answer ? `<p class="mb-2" style="white-space:pre-line">${esc(AI.answer)}</p>` : ''}
        ${AI.error ? `<div class="alert alert-danger py-2 small mb-2">${esc(AI.error)}</div>` : ''}
        ${!AI.answer && !AI.busy ? `<div class="d-flex flex-wrap gap-1 mb-2">${ideas.map((q) => `<button class="btn btn-sm btn-outline-secondary" data-act="ask-idea" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>` : ''}
        <div class="form-text mt-0">Responde con un resumen de tus números. No recibe nombres de personas ni RUT.</div>
      </div>
    </div>`;
  }
  async function ask(q) {
    q = String(q || '').trim(); if (!q || AI.busy) return;
    Object.assign(AI, { busy: true, q, answer: '', error: '' }); render();
    try { AI.answer = (await api('/api/asistente', { method: 'POST', body: JSON.stringify({ pregunta: q, resumen: aiSummary() }) })).respuesta; } catch (e) { AI.error = e.message; }
    AI.busy = false; render();
  }

  // "Puedes gastar $X por día": saldo de hoy + ingresos fijos que vienen − pagos fijos que vienen − tu mínimo,
  // repartido en los 28 días de la proyección.
  function dailyPlan(d) {
    const up = d.proj.upcoming;
    const income = up.filter((u) => u.amount > 0).reduce((s, u) => s + u.amount, 0);
    const fixed = up.filter((u) => u.amount < 0).reduce((s, u) => s - u.amount, 0);
    const free = d.total + income - fixed - d.proj.minimum;
    return { income, fixed, free, perDay: Math.max(0, Math.floor(free / 28 / 100) * 100) };
  }
  // Gastos del mes por categoría (la misma que explica cada movimiento). Deja las 6 más grandes y junta el resto.
  function spendByTag(txs, ym) {
    const by = {};
    for (const t of txs) {
      if (t.internal || t.amount >= 0 || FF.monthKey(t.date) !== ym) continue;
      const k = t.tag || 'otros';
      by[k] = by[k] || { name: k, total: 0, negocio: 0 };
      by[k].total -= t.amount; if (t.scope === 'negocio') by[k].negocio -= t.amount;
    }
    const otros = by.otros; delete by.otros;
    const list = Object.values(by).sort((x, y) => y.total - x.total);
    const rest = list.splice(6).concat(otros || []);
    if (rest.length) list.push({ name: 'otros', total: rest.reduce((s, r) => s + r.total, 0), negocio: rest.reduce((s, r) => s + r.negocio, 0) });
    return list;
  }

          </div></div>
          <div class="card"><div class="card-body">
            <div class="small text-body-secondary">Para las próximas 4 semanas</div>
            ${plan.free > 0
              ? `<div class="fs-2 fw-bold">Puedes gastar <span class="num text-primary">${fmt(plan.perDay)}</span> por día</div>`

            <table class="table table-sm small mt-2 mb-2"><tbody>
              ${planRow('Saldo de hoy', fmt(d.total))}

          ${a ? `<div class="alert alert-warning mb-0" role="alert">
              <h2 class="alert-heading h6 d-flex align-items-center gap-2"><span class="icon">${I.warn}</span>Semana del ${FF.shortDate(a.start)}: podrías bajar de tu mínimo</h2>
              <p class="mb-2">Tu saldo podría llegar a ${fmt(a.amount)} (tu mínimo es ${fmt(p.minimum)}). Con eso te alcanza para ${a.daysCovered} días de gastos personales.</p>
              <div class="d-flex flex-wrap gap-2"><button class="btn btn-sm btn-warning" data-act="tab" data-tab="proyeccion">Ver qué puedo hacer</button></div></div>`
            : `<div class="alert alert-success mb-0">${p.enough ? 'Tu saldo se mantiene sobre tu mínimo las próximas 4 semanas.' : 'Necesitamos al menos 3 meses de movimientos para proyectar con el modelo.'}</div>`}
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center"><span>Proyección · 4 semanas</span><button class="btn btn-link btn-sm p-0" data-act="tab" data-tab="proyeccion">Ver detalle</button></div>
            <div class="card-body">

          ${askCard()}

            <ul class="list-group list-group-flush">${d.smart.map((s) => `<li class="list-group-item">${esc(s)}</li>`).join('')}</ul>
          </div>
          <div class="card">
            <div class="card-header">${FF.monthName(d.ym)} · negocio vs. personal</div>
            <div class="card-body">
              <div class="row g-2 mb-3">
                <div class="col-6"><div class="border rounded p-2 h-100"><span class="badge ${BADGE.negocio}">Negocio</span><div class="fs-5 fw-bold num mt-1">${fmt(m.utilidad)}</div><div class="small text-body-secondary num">+${fmt(m.ingreso_negocio)} · −${fmt(m.gasto_operacional)}</div></div></div>
                <div class="col-6"><div class="border rounded p-2 h-100"><span class="badge ${BADGE.personal}">Personal</span><div class="fs-5 fw-bold num mt-1">−${fmt(m.gasto_personal)}</div><div class="small text-body-secondary num">Ingresos ${fmt(m.ingreso_personal)}</div></div></div>

          <div class="card d-none d-lg-block"><div class="card-body d-flex align-items-center gap-3">

          </div></div>
        </div>
      </div>`;
  }

  function txCounts() {
    const c = { todos: 0, negocio: 0, personal: 0, revisar: 0, internas: 0 };
    for (const t of D.txs) { c.todos++; if (t.internal) c.internas++; else { c[t.scope]++; if (t.review) c.revisar++; } }
    return c;
  }
  function visibleTxs() {
    const q = S.query.trim().toUpperCase();
    return D.txs.filter((t) => {
      if (S.accFilter !== 'todas' && t.account !== S.accFilter) return false;
      if (S.filter === 'negocio' && (t.internal || t.scope !== 'negocio')) return false;
      if (S.filter === 'personal' && (t.internal || t.scope !== 'personal')) return false;
      if (S.filter === 'revisar' && (t.internal || !t.review)) return false;
      if (S.filter === 'internas' && !t.internal) return false;
      if (q && !t.description.toUpperCase().includes(q) && !String(Math.abs(t.amount)).includes(q.replace(/\D/g, '') || '§')) return false;
      return true;
    }).slice().reverse();
  }
  function chipFor(t) {
    if (t.internal) return `<span class="badge ${BADGE.internal}">Entre tus cuentas</span>`;
    const label = { ingreso_negocio: 'Ingreso negocio', gasto_operacional: 'Gasto operacional', ingreso_personal: 'Ingreso personal', gasto_personal: 'Gasto personal' }[t.category];
    return `<span class="badge ${BADGE[t.scope]}">${label}</span>${t.review ? ` <span class="badge ${BADGE.review}">¿Correcto?</span>` : ''}`;
  }

  }

  // calendario: cuánto gastaste cada día
  // Más intenso = más gasto ese día. No cuenta los traspasos entre tus cuentas.
  const nextMonth = (ym) => { const [y, m] = ym.split('-').map(Number); return m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`; };
  const CAL_LEVEL = ['', 'bg-primary bg-opacity-25', 'bg-primary bg-opacity-50', 'bg-primary bg-opacity-75 text-white', 'bg-primary text-white'];
  function tabCal() {
    const ym = S.calMonth || FF.monthKey(D.today);
    const [y, m] = ym.split('-').map(Number);
    const days = new Date(y, m, 0).getDate();
    const blanks = (new Date(y, m - 1, 1).getDay() + 6) % 7; // la semana parte el lunes
    const spent = {}; let total = 0;
    for (const t of D.txs) { if (t.amount < 0 && !t.internal && FF.monthKey(t.date) === ym) { spent[t.date] = (spent[t.date] || 0) - t.amount; total -= t.amount; } }
    const max = Math.max(0, ...Object.values(spent));
    const top = Object.keys(spent).find((k) => spent[k] === max);
    let cells = '<div></div>'.repeat(blanks);
    for (let dd = 1; dd <= days; dd++) {
      const date = `${ym}-${String(dd).padStart(2, '0')}`; const g = spent[date] || 0;
      const lvl = max ? Math.ceil((g * 4) / max) : 0;
      cells += `<button class="btn cal-btn ${CAL_LEVEL[lvl]} ${date === D.today ? 'border-primary' : ''} ${date === S.calDay ? 'cal-sel' : ''}" data-act="cal-day" data-day="${date}" title="${dd} de ${FF.monthName(ym)}: ${fmt(g)} gastado"><span class="fw-semibold">${dd}</span>${g ? `<span class="cal-amt num d-none d-sm-block">${kfmt(g)}</span>` : ''}</button>`;
    }
    const sel = S.calDay && FF.monthKey(S.calDay) === ym ? S.calDay : null;
    const list = sel ? D.txs.filter((t) => t.date === sel) : [];
    return `
      ${pageTitle('Calendario', 'Cuánto gastaste cada día. Toca un día para ver sus movimientos.')}
      <div class="row g-3">
        <div class="col-lg-7"><div class="card"><div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <button class="btn btn-outline-secondary btn-sm" data-act="cal-month" data-ym="${FF.prevMonth(ym)}" aria-label="Mes anterior">&larr;</button>
            <strong class="text-capitalize">${FF.monthName(ym)} ${y}</strong>
            <button class="btn btn-outline-secondary btn-sm" data-act="cal-month" data-ym="${nextMonth(ym)}" aria-label="Mes siguiente">&rarr;</button>
          </div>
          <div class="cal-grid small text-body-secondary text-center mb-1">${['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá', 'Do'].map((n) => `<div>${n}</div>`).join('')}</div>
          <div class="cal-grid">${cells}</div>
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 small text-body-secondary mt-3">
            <span>${total ? `Gastado en ${FF.monthName(ym)}: <strong class="text-body num">${fmt(total)}</strong> · el día más caro fue el ${FF.shortDate(top)}` : 'Sin gastos este mes.'}</span>
            <span class="d-inline-flex align-items-center gap-1">Menos ${CAL_LEVEL.slice(1).map((c) => `<i class="cal-key ${c}"></i>`).join('')} Más</span>
          </div>
        </div></div></div>
        <div class="col-lg-5"><div class="card">
          <div class="card-header d-flex justify-content-between"><span>${sel ? FF.shortDate(sel) : 'Detalle del día'}</span>${sel && spent[sel] ? `<span class="num">Gastado: <strong>${fmt(spent[sel])}</strong></span>` : ''}</div>
          ${list.length ? `<div class="list-group list-group-flush">${list.map((t) => `<button class="list-group-item list-group-item-action ${t.internal ? 'is-internal' : ''}" data-act="open-tx" data-id="${esc(t.id)}">
            <span class="d-flex justify-content-between gap-3"><span class="fw-semibold text-break">${esc(t.description)}</span><span class="tx-amt fw-bold num text-nowrap ${t.amount > 0 ? 'pos' : ''}">${signed(t.amount)}</span></span>
            <span class="d-block small text-body-secondary mt-1">${chipFor(t)} ${esc(t.accountName)}</span></button>`).join('')}</div>`
            : `<div class="card-body text-body-secondary">${sel ? 'Sin movimientos este día.' : 'Toca un día del calendario para ver sus movimientos.'}</div>`}
        </div></div>
      </div>`;
  }

  // Ventana para corregir un movimiento
  function sheet() {
    const t = D.txs.find((x) => x.id === S.sheetId); if (!t) return '';
    const key = FF.counterpartyKey(t.description);
    return `<div class="modal-backdrop show"></div>
    <div class="modal d-block scrim" tabindex="-1" data-act="close-sheet"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-stop>
        <div class="modal-header"><h2 class="modal-title h6 text-break" id="sheet-title">${esc(t.description)}</h2><button type="button" class="btn-close" data-act="close-sheet" aria-label="Cerrar"></button></div>
        <div class="modal-body">
          <div class="d-flex justify-content-between align-items-center mb-3"><span class="small text-body-secondary">${FF.shortDate(t.date)} · ${esc(t.accountName)}</span><strong class="fs-5 num">${signed(t.amount)}</strong></div>
          <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="is-internal" ${t.internal ? 'checked' : ''}><label class="form-check-label" for="is-internal">Es un traspaso entre mis cuentas (no cuenta como ingreso ni gasto)</label></div>
          <div id="scope-block" style="${t.internal ? 'opacity:.4' : ''}">

            <div class="row g-2 mb-2" role="group" aria-label="Ámbito">
              <div class="col-6"><button class="btn btn-outline-primary w-100 ${t.scope === 'negocio' ? 'active' : ''}" data-act="pick-scope" data-scope="negocio" aria-pressed="${t.scope === 'negocio'}">Negocio</button></div>
              <div class="col-6"><button class="btn btn-outline-primary w-100 ${t.scope === 'personal' ? 'active' : ''}" data-act="pick-scope" data-scope="personal" aria-pressed="${t.scope === 'personal'}">Personal</button></div>
            </div>
            <div class="form-text mb-3">Motivo actual: ${esc(t.reason)}</div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="apply-all" checked><label class="form-check-label" for="apply-all">Aplicar también a los otros movimientos de ${esc(FF.titleCase(key) || 'esta contraparte')}</label></div>
          </div>
        </div>
        <div class="modal-footer"><button class="btn btn-outline-secondary" data-act="close-sheet">Cancelar</button><button class="btn btn-primary" data-act="save-tx">Guardar</button></div>
      </div>
    </div></div>`;
  }


  // render
  let pickedScope = null;
  function render() {
    D = S.accounts.length ? derive(S) : null;
    if (S.view === 'app' && !D) S.view = 'onboard';
    const html = { landing: viewLanding, auth: viewAuth, onboard: viewOnboard, app: viewApp }[S.view]();
    $root.innerHTML = html;
    save();
    afterRender();
    if (animateNext) countUp();
    animateNext = false;
  }
  function afterRender() {
    googleButton();
    const qr = document.getElementById('qr');
    if (qr && window.QRCode) { try { new window.QRCode(qr, { text: SHARE_URL, width: 96, height: 96, colorDark: '#0c1214', colorLight: '#ffffff' }); } catch (e) { qr.textContent = 'QR'; } }
    const dz = document.getElementById('dropzone');
    if (dz) {
      dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('over'));
      dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files[0]) importFile(e.dataTransfer.files[0]); });
    }
  }
  const go = (patch) => { Object.assign(S, patch); animateNext = true; render(); window.scrollTo(0, 0); };

  // importar
  function bankShort(b) { return { 'BancoEstado CuentaRUT': 'CuentaRUT', 'Otro banco': 'Otra cuenta' }[b] || b; }
  function readFile(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      if (/\.xlsx?$/i.test(file.name)) {
        r.onload = () => { try { const wb = window.XLSX.read(r.result, { type: 'array' }); resolve(window.XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]], { FS: ';' })); } catch (e) { reject(new Error('No pudimos leer el Excel.')); } };
        r.readAsArrayBuffer(file);
      } else { r.onload = () => resolve(r.result); r.readAsText(file, 'utf-8'); }
      r.onerror = () => reject(new Error('No pudimos leer el archivo.'));
    });
  }
  // conexión bancaria (Fintoc)
  // Las llaves secretas y el link_token viven solo en el servidor (server.js).
  async function api(path, opts) {
    const r = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' }, opts));
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'No pudimos comunicarnos con el servidor.');
    return j;
  }
  fetch('/api/fintoc/config').then((r) => (r.ok ? r.json() : null)).then((c) => { if (c) { FINTOC.enabled = !!c.enabled; AI.enabled = !!c.asistente; GOOGLE.clientId = c.googleClientId || ''; render(); } }).catch(() => { /* sin servidor: solo cartolas */ });

  // inicio de sesión con Google
  // Google dibuja el botón y entrega un token; el servidor lo comprueba y crea la sesión.
  function googleButton() {
    const el = document.getElementById('google-btn');
    if (!el || !GOOGLE.clientId || !window.google) return;
    if (!GOOGLE.listo) { window.google.accounts.id.initialize({ client_id: GOOGLE.clientId, callback: googleLogin }); GOOGLE.listo = true; }
    window.google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', text: 'continue_with', locale: 'es', width: Math.min(el.offsetWidth, 400) });
  }
  const googleLogin = (resp) => abrirSesion('/api/login/google', { credential: resp.credential });
  window.onGoogleLibraryLoad = googleButton;

  // cuentas: el servidor comprueba los datos y crea la sesión; acá solo se guarda quién entró
  async function abrirSesion(ruta, datos) {
    try {
      const { usuario } = await api(ruta, { method: 'POST', body: JSON.stringify(datos) });
      go({ view: S.accounts.length ? 'app' : 'onboard', step: 1, user: { email: usuario.email, name: usuario.nombre } });
    } catch (e) { const el = document.getElementById('auth-error'); if (el) el.textContent = e.message; }
  }
  // Al abrir la página: si la sesión ya no existe en el servidor, vuelve a la portada.
  api('/api/sesion').then((s) => {
    if (s.usuario) { S.user = { email: s.usuario.email, name: s.usuario.nombre }; save(); }
    else if (S.user && !S.sample) go({ view: 'landing', user: null });
    else if (S.user) { S.user = null; save(); }
  }).catch(() => {});

  async function syncFintoc() {
    const j = await api('/api/fintoc/movements');
    const usable = j.accounts.filter((a) => a.rows.length);
    if (!usable.length) throw new Error('Tu banco no devolvió movimientos en el último año.');
    if (S.sample) { S.accounts = []; S.sample = false; }
    let added = 0, dup = 0;
    for (const fa of usable) {
      let acc = S.accounts.find((a) => a.id === fa.id);
      if (acc) { const m = FF.mergeRows(acc.rows, fa.rows); acc.rows = m.rows; added += m.added; dup += m.duplicates; }
      else {
        if (S.accounts.length >= 3) break;
        acc = { id: fa.id, name: fa.name, bank: fa.bank, source: 'fintoc', rows: fa.rows }; S.accounts.push(acc); added += fa.rows.length;
      }
      // El saldo real del banco ancla el saldo de la última fila.
      if (fa.balance !== null && acc.rows.length) acc.rows[acc.rows.length - 1].balance = fa.balance;
    }
    return `Banco conectado: ${added} movimientos nuevos${dup ? `, ${dup} repetidos ignorados` : ''}.`;
  }
  async function runFintoc(connect) {
    if (FINTOC.busy) return;
    FINTOC.busy = true; FINTOC.msg = null; render();
    try {
      if (connect) {
        if (!window.Fintoc) throw new Error('No pudimos cargar el widget de Fintoc. Revisa tu conexión.');
        const { widgetToken, publicKey } = await api('/api/fintoc/link-intent', { method: 'POST', body: '{}' });
        await new Promise((resolve, reject) => {
          const widget = window.Fintoc.create({
            publicKey, widgetToken,
            onSuccess: (li) => { api('/api/fintoc/exchange', { method: 'POST', body: JSON.stringify({ exchangeToken: li.exchangeToken }) }).then(resolve, reject); },
            onExit: () => reject(new Error('__cancel__')),
          });
          if (widget && typeof widget.open === 'function') widget.open();
        });
      }
      const text = await syncFintoc();
      FINTOC.msg = text; FINTOC.busy = false;
      go({ importMsg: { ok: true, text } });
    } catch (e) {
      FINTOC.busy = false;
      if (e.message === '__cancel__') { render(); return; }
      FINTOC.msg = e.message; go({ importMsg: { ok: false, text: e.message } });
    }
  }
  async function importFile(file) {
    try {
      const text = await readFile(file);
      const parsed = FF.parseStatement(text);
      const name = bankShort(S.bank);
      let acc = S.accounts.find((a) => a.bank === S.bank);
      let added = parsed.rows.length, dup = 0;
      if (acc) { const m = FF.mergeRows(acc.rows, parsed.rows); acc.rows = m.rows; added = m.added; dup = m.duplicates; }
      else { if (S.accounts.length >= 3) throw new Error('Ya tienes 3 cuentas. Quita una desde tu perfil para agregar otra.'); S.accounts.push({ id: 'a' + Date.now(), name, bank: S.bank, rows: parsed.rows }); }
      const check = parsed.check ? (parsed.check.ok ? ' · saldo verificado' : ' · ojo: el saldo no cuadra, puede faltar una página') : '';
      S.sample = false;
      go({ importMsg: { ok: true, text: `${name}: ${added} movimientos nuevos${dup ? `, ${dup} repetidos ignorados` : ''}${check}.` } });
    } catch (e) {
      go({ importMsg: { ok: false, text: e.message } });
    }
  }

  // eventos
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (el.dataset.act === 'close-sheet' && e.target.closest('[data-stop]') && el.classList.contains('scrim')) return;
    const act = el.dataset.act;
    switch (act) {
      case 'go-auth': e.preventDefault(); go({ view: 'auth', authMode: el.dataset.modo || 'registro' }); break;
      case 'go-landing': go({ view: 'landing' }); break;
      case 'try-sample': loadSample(); break;
      case 'load-sample': loadSample(); break;
      case 'bank': go({ bank: el.dataset.bank, importMsg: null }); break;
      case 'fintoc-connect': runFintoc(true); break;
      case 'fintoc-sync': runFintoc(false); break;
      case 'finish': go({ view: 'app', tab: 'inicio', importMsg: null }); break;
      case 'tab': go({ tab: el.dataset.tab, sheetId: null }); break;
      case 'filter': S.filter = el.dataset.f; render(); break;
      case 'cal-month': S.calMonth = el.dataset.ym; S.calDay = null; render(); break;
      case 'cal-day': S.calDay = el.dataset.day; render(); break;
      case 'open-tx': pickedScope = null; S.sheetId = el.dataset.id; render(); setTimeout(() => { const b = document.querySelector('.sheet button'); if (b) b.focus(); }, 0); break;
      case 'close-sheet': S.sheetId = null; render(); break;
      case 'pick-scope': pickedScope = el.dataset.scope; document.querySelectorAll('[data-act="pick-scope"]').forEach((b) => { b.setAttribute('aria-pressed', String(b === el)); b.classList.toggle('active', b === el); }); break;
      case 'save-tx': saveTx(); break;
      case 'ask-idea': ask(el.dataset.q); break;
      case 'add-account': go({ view: 'onboard', step: 2, importMsg: null }); break;
      case 'remove-acc': S.accounts = S.accounts.filter((a) => a.id !== el.dataset.id); if (!S.accounts.length) go({ view: 'onboard', step: 2 }); else render(); break;
      case 'export': S.exportOpen = !S.exportOpen; render(); break;
      case 'copy-csv': { const ta = document.getElementById('csv'); const msg = document.getElementById('copy-msg'); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => { msg.textContent = 'Copiado.'; }).catch(() => { ta.select(); msg.textContent = 'Selecciónalo y cópialo con Ctrl+C.'; }); break; }
      case 'ask-delete': S.confirmDelete = true; render(); break;
      case 'cancel-delete': S.confirmDelete = false; render(); break;
      case 'do-delete': fetch('/api/fintoc/link', { method: 'DELETE', credentials: 'same-origin' }).catch(() => {}); S = fresh(); try { localStorage.removeItem(STORE); } catch (err) { /* nada */ } render(); break;
      case 'logout': api('/api/logout', { method: 'POST' }).catch(() => {}); go({ view: 'landing', user: null }); break;
    }
  });
  function loadSample() {
    S.holder = 'Valentina Rojas Fuentes'; S.consent = true; S.sample = true;
    S.accounts = JSON.parse(JSON.stringify(SAMPLE_STATE.accounts)); S.rules = { __tx: {}, __internal: {} };
    go({ view: 'app', tab: 'inicio', importMsg: null });
  }
  function saveTx() {
    const t = D.txs.find((x) => x.id === S.sheetId); if (!t) return;
    const internal = document.getElementById('is-internal').checked;
    const applyAll = document.getElementById('apply-all').checked;
    if (internal !== t.internal) S.rules.__internal[t.id] = internal;
    const scope = pickedScope || t.scope;
    if (!internal && scope !== t.scope) {
      if (applyAll) S.rules[FF.counterpartyKey(t.description)] = scope; else S.rules.__tx[t.id] = scope;
    }
    S.sheetId = null; render();
  }
  document.addEventListener('submit', (e) => {
    const f = e.target.dataset.form; if (!f) return; e.preventDefault();
    if (f === 'login') {
      const val = (id) => (document.getElementById(id) || {}).value || '';
      if (S.authMode === 'entrar') abrirSesion('/api/login', { email: val('email'), clave: val('pass') });
      else abrirSesion('/api/registro', { nombre: val('nombre'), email: val('email'), clave: val('pass') });
    }
    if (f === 'ask') ask(document.getElementById('ask-q').value);
    if (f === 'holder') { S.holder = document.getElementById('holder').value.trim(); S.consent = document.getElementById('consent').checked; go({ step: 2 }); }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'q') { S.query = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
    if (e.target.id === 'is-internal') { const b = document.getElementById('scope-block'); if (b) b.style.opacity = e.target.checked ? '.4' : '1'; }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'file' && e.target.files[0]) importFile(e.target.files[0]);
    if (e.target.id === 'accf') { S.accFilter = e.target.value; render(); }
    if (e.target.id === 'minimum') { const v = Math.max(0, Number(e.target.value) || 0); S.minimum = v; render(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheetId) { S.sheetId = null; render(); } });

  render();
})();

</script>
</body>
</html>
