services:
  # Base de datos PostgreSQL
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datos_db:/var/lib/postgresql/data
    ports:
      # 5433 en el computador (el 5432 suele estar ocupado por un PostgreSQL local) -> 5432 en el contenedor
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # La página y la API (Django). Parte cuando la base de datos está lista.
  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # El código se monta desde el computador: los cambios se ven sin reconstruir la imagen.
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_db:
