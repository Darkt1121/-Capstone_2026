{% extends "core/base.html" %}

{% block publico %}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <h1 class="h3 mb-3 fw-normal">Ingresar a FinFlow</h1>
    {% if form.errors %}
      <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-floating mb-2">
        <input class="form-control" type="text" name="username" id="id_username" placeholder="Usuario" autofocus required>
        <label for="id_username">Usuario</label>
      </div>
      <div class="form-floating mb-3">
        <input class="form-control" type="password" name="password" id="id_password" placeholder="Contraseña" required>
        <label for="id_password">Contraseña</label>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100 py-2">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
