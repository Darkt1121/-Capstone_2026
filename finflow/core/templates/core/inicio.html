<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand fw-bold">FinFlow</span>
    </div>
  </nav>

  <main class="container py-5">
    <h1>Bienvenido a FinFlow</h1>
    <p class="text-muted">Cuánto pagar, cuánto ahorrar y cuánto te queda libre.</p>

    {% if version_bd %}
      <div class="alert alert-success">
        Todo funciona: Django está conectado a PostgreSQL.<br>
        <small>{{ version_bd }}</small>
      </div>
    {% else %}
      <div class="alert alert-danger">No hay conexión con la base de datos. Revisa los logs de Docker.</div>
    {% endif %}
  </main>
</body>
</html>
